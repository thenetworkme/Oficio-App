<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Pegatina — Cierre del reto</title>
<script src="./dc-runtime.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&amp;family=Space+Mono:wght@400;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#FFF4D6}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font-family:inherit}
button{cursor:pointer}
a:focus-visible,button:focus-visible,input:focus-visible,textarea:focus-visible{outline:4px solid var(--ink,#111);outline-offset:3px}
.bx{border:3px solid var(--bd,#111);border-radius:14px;box-shadow:6px 6px 0 var(--sh,#111)}
.mono{font-family:'Space Mono',monospace}
.lbl{font-family:'Space Mono',monospace;font-weight:700;font-size:13px;text-transform:uppercase;letter-spacing:.02em}
.h1{margin:0;font-size:84px;line-height:.95;font-weight:700;letter-spacing:-.05em}
.h2{margin:0;font-size:38px;line-height:1.05;font-weight:700;letter-spacing:-.03em}
.h3{margin:0;font-size:28px;line-height:1.1;font-weight:700;letter-spacing:-.03em}
.chip{min-height:44px;padding:0 18px;border:3px solid var(--bd,#111);border-radius:999px;font-weight:700;font-size:15px;background:var(--card,#fff);color:var(--ink,#111)}
.btn{min-height:56px;padding:0 28px;font-size:20px;font-weight:700;color:#111;display:inline-flex;align-items:center;justify-content:center}
.in{min-height:48px;padding:0 14px;border:3px solid var(--bd,#111);border-radius:12px;font-size:16px;background:var(--card,#fff);color:var(--ink,#111);width:100%;box-sizing:border-box}
.in::placeholder{color:#6b6b6b}
.hov{transition:transform .12s,box-shadow .12s}
.hov:hover{transform:translate(-2px,-2px) rotate(var(--r,0deg));box-shadow:9px 9px 0 var(--sh,#111)}
.press:active{transform:translate(4px,4px);box-shadow:2px 2px 0 var(--sh,#111)}
@media (prefers-reduced-motion:reduce){.hov{transition:none}}
</style>
</helmet>
<div style="background:var(--bg,#FFF4D6);color:var(--ink,#111);font-family:'Space Grotesk',system-ui,sans-serif;font-size:16px;line-height:1.4;min-height:1730px;padding:28px 48px 64px;box-sizing:border-box;display:flex;flex-direction:column;gap:32px;">
<header style="display:flex;align-items:center;gap:16px;flex-wrap:wrap">
<a href="PegatinaPanel.dc.html" class="bx" style="background:var(--a1,#FFD84D);color:#111;padding:6px 18px;font-size:30px;font-weight:700;transform:rotate(-2deg);letter-spacing:-.02em">oficio!</a>
<nav aria-label="Principal" style="display:flex;gap:8px;flex:1;flex-wrap:wrap"><a href="PegatinaPanel.dc.html" style="min-height:44px;display:flex;align-items:center;padding:0 16px;border:3px solid var(--bd,#111);border-radius:999px;font-weight:700">Hoy</a><a href="PegatinaRetos.dc.html" aria-current="page" style="min-height:44px;display:flex;align-items:center;padding:0 16px;border:3px solid var(--bd,#111);border-radius:999px;background:var(--ink,#111);color:var(--paper,#FFF4D6);font-weight:700">Retos</a><a href="PegatinaTimer.dc.html" style="min-height:44px;display:flex;align-items:center;padding:0 16px;border:3px solid var(--bd,#111);border-radius:999px;font-weight:700">Tomate</a><a href="PegatinaStats.dc.html" style="min-height:44px;display:flex;align-items:center;padding:0 16px;border:3px solid var(--bd,#111);border-radius:999px;font-weight:700">Números</a><a href="PegatinaLogros.dc.html" style="min-height:44px;display:flex;align-items:center;padding:0 16px;border:3px solid var(--bd,#111);border-radius:999px;font-weight:700">Logros</a><a href="PegatinaTienda.dc.html" style="min-height:44px;display:flex;align-items:center;padding:0 16px;border:3px solid var(--bd,#111);border-radius:999px;font-weight:700">Tienda</a><a href="PegatinaAvisos.dc.html" style="min-height:44px;display:flex;align-items:center;padding:0 16px;border:3px solid var(--bd,#111);border-radius:999px;font-weight:700">Avisos</a><a href="PegatinaAjustes.dc.html" style="min-height:44px;display:flex;align-items:center;padding:0 16px;border:3px solid var(--bd,#111);border-radius:999px;font-weight:700">Ajustes</a></nav>
<a href="PegatinaAjustes.dc.html" aria-label="Perfil de Kobox" class="bx" style="background:var(--a3,#7BE0A4);color:#111;padding:6px 16px 6px 8px;min-height:44px;box-sizing:border-box;display:flex;align-items:center;gap:10px;font-weight:700"><span aria-hidden="true" style="width:32px;height:32px;border-radius:50%;background:#111;color:var(--a3,#7BE0A4);display:flex;align-items:center;justify-content:center">K</span>Kobox</a>
<a href="PegatinaLogin.dc.html" aria-label="Cerrar sesión" class="bx press" style="width:50px;height:50px;background:var(--card,#fff);color:var(--ink,#111);display:flex;align-items:center;justify-content:center;padding:0"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg></a>
</header>
<nav aria-label="Ruta" style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><a href="PegatinaRetos.dc.html" class="bx press" style="min-height:44px;padding:0 16px;display:flex;align-items:center;background:var(--card,#fff);font-weight:700">← Retos</a><span class="lbl">Cierre del reto</span></nav>
<div role="tablist" aria-label="Versión" style="display:flex;gap:10px;flex-wrap:wrap"><sc-for list="{{tabs}}" as="t" hint-placeholder-count="2"><button type="button" role="tab" aria-selected="{{t.on}}" onClick="{{t.pick}}" class="chip press" style="background:{{t.bg}};color:{{t.fg}};box-shadow:{{t.sh}}">{{t.l}}</button></sc-for></div>
<section style="display:flex;gap:32px;flex-wrap:wrap;align-items:stretch">
<div class="bx" style="flex:2 1 640px;background:{{heroBg}};padding:34px 38px;color:#111;display:flex;flex-direction:column;gap:14px;transform:rotate(-.6deg)">
<span class="lbl">{{kicker}}</span>
<h1 class="h1" style="font-size:76px"><span style="letter-spacing:-.05em">{{title}}</span></h1>
<p style="margin:0;font-size:22px;font-weight:500;max-width:620px">{{sub}}</p>
<div style="display:flex;gap:12px;flex-wrap:wrap;margin-top:auto"><span class="chip" style="display:inline-flex;align-items:center;background:#fff">{{chip1}}</span><span class="chip" style="display:inline-flex;align-items:center;background:#fff">{{chip2}}</span></div>
</div>
<div class="bx" style="flex:1 1 320px;background:{{charBg}};padding:16px;display:flex;align-items:center;justify-content:center;transform:rotate(1.4deg)"><img src="{{dog}}" alt="{{dogAlt}}" style="width:100%;max-width:300px;height:auto;display:block"></div>
</section>
<section style="display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:22px">
<sc-for list="{{stats}}" as="k" hint-placeholder-count="4"><div class="bx" style="background:{{k.bg}};padding:18px 22px;color:#111"><span class="lbl" style="font-size:12px">{{k.l}}</span><div style="font-size:42px;font-weight:700;letter-spacing:-.04em;line-height:1.05"><span style="letter-spacing:0">{{k.v}}</span></div><span class="mono" style="font-size:12px">{{k.s}}</span></div></sc-for>
</section>
<section class="bx" style="background:#fff;padding:26px 30px;color:#111;display:flex;flex-direction:column;gap:14px"><div style="display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap"><h2 class="h3">Minutos por día</h2><span class="mono" style="font-size:13px">{{legend}}</span></div>
<div role="img" aria-label="{{chartAria}}" style="display:flex;align-items:flex-end;gap:6px;height:170px;border-bottom:3px solid #111;padding-bottom:0"><sc-for list="{{bars}}" as="b" hint-placeholder-count="30"><div style="flex:1;height:{{b.h}}px;background:{{b.bg}};border:3px solid #111;border-bottom:0;border-radius:6px 6px 0 0;min-height:4px"></div></sc-for></div></section>
<section style="display:flex;flex-direction:column;gap:20px"><h2 class="h2">{{rewardTitle}}</h2>
<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:24px"><sc-for list="{{rewards}}" as="r" hint-placeholder-count="3"><div class="bx hov" style="--r:{{r.rot}};background:#fff;padding:20px 22px;display:flex;gap:18px;align-items:center;color:#111;transform:rotate({{r.rot}})"><div style="flex:0 0 76px;height:76px;border:3px solid #111;border-radius:50%;background:{{r.bg}};display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:700"><span style="letter-spacing:0">{{r.sym}}</span></div><div><div style="font-size:22px;font-weight:700;letter-spacing:-.02em;line-height:1.1">{{r.t}}</div><div class="mono" style="font-size:12px;margin-top:4px">{{r.s}}</div></div></div></sc-for></div></section>
<section style="display:flex;flex-direction:column;gap:20px"><h2 class="h2">{{nextTitle}}</h2>
<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:24px"><sc-for list="{{nexts}}" as="n" hint-placeholder-count="3"><a href="{{n.href}}" class="bx hov press" style="--r:0deg;background:{{n.bg}};padding:20px 24px;color:#111;display:flex;flex-direction:column;gap:8px;min-height:130px"><span style="font-size:24px;font-weight:700;letter-spacing:-.02em;line-height:1.1">{{n.t}}</span><span style="font-size:16px;font-weight:500">{{n.s}}</span><span style="margin-top:auto;font-weight:700">{{n.cta}} →</span></a></sc-for></div></section>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1360,"height":1730}}'>
class Component extends DCLogic {
  hm(m) { const h = Math.floor(m / 60), r = m % 60; if (h === 0) return r + ' min'; return r === 0 ? h + ' h' : h + ' h ' + r + ' min'; }
  uri(svg) { return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg); }
  buildSvg(kind, o) {
    o = o || {};
    const mood = o.mood || 'idle';
    const hat = o.hat || null, cape = o.cape || null, acc = o.acc || null, bg = o.bg || null;
    const dog = kind === 'dog';
    const L = '#111', W = 5;
    const st = 'stroke="' + L + '" stroke-width="' + W + '" stroke-linejoin="round" stroke-linecap="round"';
    const st3 = 'stroke="' + L + '" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round"';
    const P = dog
      ? { main: o.color || '#F2B45B', dark: '#B8742E', cream: '#FFF1D6' }
      : { skin: o.skin || '#F0B98A', hair: '#2B2B2B', top: o.color || '#FFD84D', topD: '#E9A81C', pants: '#7CC4FF' };
    const G = dog
      ? { hatY: 62, hatS: 1, neckY: 166, eyeL: [92, 100], eyeR: [148, 100], capeTop: 160, capeSh: [80, 160], capeBot: [38, 202], pivot: [120, 160] }
      : { hatY: 60, hatS: 1.02, neckY: 160, eyeL: [100, 108], eyeR: [140, 108], capeTop: 154, capeSh: [74, 166], capeBot: [34, 206], pivot: [120, 156] };
    const out = [];
    const add = (s) => out.push(s);
    if (bg) add('<rect x="4" y="4" width="232" height="252" rx="34" fill="' + bg + '" ' + st + '/>');
    add('<ellipse cx="120" cy="' + (dog ? 246 : 253) + '" rx="' + (dog ? 74 : 62) + '" ry="9" fill="rgba(17,17,17,.2)"/>');

    // ---------- CAPES (behind the body)
    const capePath = 'M' + G.capeSh[0] + ' ' + G.capeTop + ' L' + G.capeBot[0] + ' ' + (dog ? 240 : 246) + ' Q120 ' + (dog ? 256 : 262) + ' ' + G.capeBot[1] + ' ' + (dog ? 240 : 246) + ' L' + G.capeSh[1] + ' ' + G.capeTop + ' Z';
    if (cape === 'red') add('<path d="' + capePath + '" fill="#FF4D4D" ' + st + '/><path d="M' + (G.capeBot[0] + 14) + ' ' + (dog ? 232 : 238) + ' Q120 250 ' + (G.capeBot[1] - 14) + ' ' + (dog ? 232 : 238) + '" fill="none" stroke="#C93030" stroke-width="4" stroke-linecap="round"/>');
    if (cape === 'star') add('<path d="' + capePath + '" fill="#2B3A8C" ' + st + '/><g fill="#FFD84D"><circle cx="58" cy="214" r="5"/><circle cx="182" cy="208" r="5"/><circle cx="84" cy="236" r="4"/><circle cx="158" cy="234" r="4"/><circle cx="120" cy="244" r="3.5"/></g>');
    if (cape === 'master') add('<path d="' + capePath + '" fill="#FFD84D" ' + st + '/><path d="M' + (G.capeBot[0] + 8) + ' ' + (dog ? 226 : 232) + ' Q120 244 ' + (G.capeBot[1] - 8) + ' ' + (dog ? 226 : 232) + '" fill="none" stroke="#111" stroke-width="5" stroke-linecap="round"/><g fill="#FF8FB8" stroke="#111" stroke-width="3"><circle cx="70" cy="' + (dog ? 226 : 232) + '" r="5"/><circle cx="170" cy="' + (dog ? 226 : 232) + '" r="5"/></g>');

    // ---------- BODY
    const happy = mood === 'celebrate';
    if (dog) {
      const tail = happy
        ? 'M164 208 C204 214 224 164 204 136 C196 124 182 134 190 148 C198 166 190 188 164 192 Z'
        : 'M164 214 C198 218 212 186 198 164 C192 154 180 160 184 172 C188 188 178 198 164 198 Z';
      add('<path d="' + tail + '" fill="' + P.main + '" ' + st + '/>');
      add('<ellipse cx="120" cy="198" rx="52" ry="46" fill="' + P.main + '" ' + st + '/>');
      add('<ellipse cx="120" cy="210" rx="30" ry="30" fill="' + P.cream + '"/>');
      add('<ellipse cx="72" cy="238" rx="19" ry="10" fill="' + P.main + '" ' + st + '/><ellipse cx="168" cy="238" rx="19" ry="10" fill="' + P.main + '" ' + st + '/>');
      if (happy) {
        add('<g transform="rotate(-38 92 196)"><rect x="80" y="150" width="24" height="52" rx="12" fill="' + P.main + '" ' + st + '/><ellipse cx="92" cy="152" rx="13" ry="9" fill="' + P.cream + '" ' + st + '/></g>');
        add('<g transform="rotate(38 148 196)"><rect x="136" y="150" width="24" height="52" rx="12" fill="' + P.main + '" ' + st + '/><ellipse cx="148" cy="152" rx="13" ry="9" fill="' + P.cream + '" ' + st + '/></g>');
      } else {
        add('<rect x="90" y="204" width="26" height="36" rx="13" fill="' + P.main + '" ' + st + '/><ellipse cx="103" cy="238" rx="15" ry="9" fill="' + P.cream + '" ' + st + '/>');
        add('<rect x="124" y="204" width="26" height="36" rx="13" fill="' + P.main + '" ' + st + '/><ellipse cx="137" cy="238" rx="15" ry="9" fill="' + P.cream + '" ' + st + '/>');
      }
      add('<path d="M82 164 Q120 184 158 164 L156 180 Q120 200 84 180 Z" fill="#FF8FB8" ' + st + '/><circle cx="120" cy="192" r="8" fill="#FFD84D" ' + st3 + '/>');
    } else {
      add('<rect x="90" y="224" width="25" height="24" rx="8" fill="' + P.pants + '" ' + st + '/><rect x="125" y="224" width="25" height="24" rx="8" fill="' + P.pants + '" ' + st + '/>');
      add('<ellipse cx="98" cy="248" rx="19" ry="8" fill="#fff" ' + st + '/><ellipse cx="142" cy="248" rx="19" ry="8" fill="#fff" ' + st + '/>');
      const arm = (side) => {
        const sx = side === 'l' ? 1 : -1;
        const px = side === 'l' ? 78 : 162;
        const body = 'M' + px + ' 172 C' + (px - 22 * sx) + ' 180 ' + (px - 26 * sx) + ' 208 ' + (px - 20 * sx) + ' 222 C' + (px - 12 * sx) + ' 230 ' + (px - 2 * sx) + ' 226 ' + (px) + ' 214 L' + (px + 4 * sx) + ' 178 Z';
        const hand = '<circle cx="' + (px - 20 * sx) + '" cy="226" r="10" fill="' + P.skin + '" ' + st + '/>';
        const g = '<path d="' + body + '" fill="' + P.top + '" ' + st + '/>' + hand;
        return happy ? '<g transform="rotate(' + (side === 'l' ? 150 : -150) + ' ' + px + ' 172)">' + g + '</g>' : g;
      };
      add('<path d="M74 170 C74 156 96 150 120 150 C144 150 166 156 166 170 L170 222 C150 230 90 230 70 222 Z" fill="' + P.top + '" ' + st + '/>');
      add('<path d="M94 200 L146 200 L150 220 C132 226 108 226 90 220 Z" fill="' + P.topD + '" ' + st3 + '/>');
      add('<path d="M90 154 Q120 176 150 154 L150 166 Q120 188 90 166 Z" fill="' + P.topD + '" ' + st3 + '/><path d="M112 176 L112 196 M128 176 L128 196" stroke="#fff" stroke-width="4" stroke-linecap="round"/>');
      add(arm('l'));
      add(arm('r'));
      add('<rect x="108" y="140" width="24" height="20" rx="8" fill="' + P.skin + '" ' + st + '/>');
    }
    // neck accessories (on the body)
    if (acc === 'scarf') add('<g transform="translate(120 ' + G.neckY + ')"><path d="M-46 -6 Q0 16 46 -6 L50 14 Q0 36 -50 14 Z" fill="#FF4D4D" ' + st + '/><path d="M22 20 L42 58 L14 54 Z" fill="#FF4D4D" ' + st + '/><path d="M-30 6 L-24 18 M-8 14 L-4 26" stroke="#C93030" stroke-width="4" stroke-linecap="round"/></g>');
    if (acc === 'bow') add('<g transform="translate(120 ' + (G.neckY + 12) + ')"><path d="M0 0 L-30 -17 L-30 17 Z" fill="#FF8FB8" ' + st + '/><path d="M0 0 L30 -17 L30 17 Z" fill="#FF8FB8" ' + st + '/><circle r="9" fill="#FFD84D" ' + st + '/></g>');
    if (cape === 'master') add('<circle cx="120" cy="' + (G.neckY + 14) + '" r="9" fill="#FF8FB8" ' + st3 + '/>');
    if (cape === 'red' || cape === 'star') add('<path d="M96 ' + (G.neckY + 6) + ' Q120 ' + (G.neckY + 22) + ' 144 ' + (G.neckY + 6) + '" fill="none" stroke="' + (cape === 'red' ? '#C93030' : '#FFD84D') + '" stroke-width="7" stroke-linecap="round"/>');

    // ---------- HEAD (tilts when sleepy)
    const tilt = mood === 'sleepy' ? ' transform="rotate(-7 ' + G.pivot[0] + ' ' + G.pivot[1] + ')"' : '';
    add('<g' + tilt + '>');
    const eyes = (lx, ly, rx, ry, rr, hr) => {
      if (mood === 'celebrate') return '<path d="M' + (lx - 11) + ' ' + (ly + 3) + ' Q' + lx + ' ' + (ly - 14) + ' ' + (lx + 11) + ' ' + (ly + 3) + '" fill="none" stroke="#111" stroke-width="5.5" stroke-linecap="round"/><path d="M' + (rx - 11) + ' ' + (ry + 3) + ' Q' + rx + ' ' + (ry - 14) + ' ' + (rx + 11) + ' ' + (ry + 3) + '" fill="none" stroke="#111" stroke-width="5.5" stroke-linecap="round"/>';
      if (mood === 'sleepy') return '<path d="M' + (lx - 11) + ' ' + (ly - 2) + ' Q' + lx + ' ' + (ly + 9) + ' ' + (lx + 11) + ' ' + (ly - 2) + '" fill="none" stroke="#111" stroke-width="5" stroke-linecap="round"/><path d="M' + (rx - 11) + ' ' + (ry - 2) + ' Q' + rx + ' ' + (ry + 9) + ' ' + (rx + 11) + ' ' + (ry - 2) + '" fill="none" stroke="#111" stroke-width="5" stroke-linecap="round"/>';
      return '<ellipse cx="' + lx + '" cy="' + ly + '" rx="' + rr + '" ry="' + (rr + 2.5) + '" fill="#111"/><ellipse cx="' + rx + '" cy="' + ry + '" rx="' + rr + '" ry="' + (rr + 2.5) + '" fill="#111"/><circle cx="' + (lx - 2.6) + '" cy="' + (ly - 4.4) + '" r="' + hr + '" fill="#fff"/><circle cx="' + (rx - 2.6) + '" cy="' + (ry - 4.4) + '" r="' + hr + '" fill="#fff"/><circle cx="' + (lx + 3) + '" cy="' + (ly + 4) + '" r="1.6" fill="#fff" opacity=".7"/><circle cx="' + (rx + 3) + '" cy="' + (ry + 4) + '" r="1.6" fill="#fff" opacity=".7"/>';
    };
    if (dog) {
      // ears behind head edge, face on top
      add('<path d="M66 66 C36 60 24 96 32 134 C38 154 62 150 72 128 C78 108 78 82 66 66 Z" fill="' + P.dark + '" ' + st + '/>');
      add('<path d="M174 66 C204 60 216 96 208 134 C202 154 178 150 168 128 C162 108 162 82 174 66 Z" fill="' + P.dark + '" ' + st + '/>');
      add('<ellipse cx="120" cy="104" rx="64" ry="54" fill="' + P.main + '" ' + st + '/>');
      add('<path d="M120 54 C108 68 105 86 111 104 L129 104 C135 86 132 68 120 54 Z" fill="' + P.cream + '"/>');
      add('<ellipse cx="120" cy="130" rx="32" ry="24" fill="' + P.cream + '" ' + st + '/>');
      add('<circle cx="76" cy="124" r="9" fill="#FF8FB8" opacity=".6"/><circle cx="164" cy="124" r="9" fill="#FF8FB8" opacity=".6"/>');
      add(eyes(92, 100, 148, 100, 8, 3));
      if (mood === 'idle') add('<path d="M82 84 Q92 78 102 84 M138 84 Q148 78 158 84" fill="none" stroke="#111" stroke-width="4" stroke-linecap="round"/>');
      add('<path d="M108 116 Q120 108 132 116 Q130 127 120 129 Q110 127 108 116 Z" fill="#111" ' + st3 + '/><ellipse cx="116" cy="115" rx="4" ry="2" fill="#fff" opacity=".6"/>');
      if (happy) add('<path d="M102 136 Q120 168 138 136 Z" fill="#7A1F2E" ' + st3 + '/><path d="M110 152 Q120 144 130 152 Q120 164 110 152 Z" fill="#FF8FB8"/><path d="M120 129 L120 137" stroke="#111" stroke-width="4" stroke-linecap="round"/>');
      else if (mood === 'sleepy') add('<path d="M120 129 L120 136 M108 140 Q120 146 132 140" fill="none" stroke="#111" stroke-width="4" stroke-linecap="round"/>');
      else add('<path d="M120 129 L120 136 M104 137 Q112 146 120 136 Q128 146 136 137" fill="none" stroke="#111" stroke-width="4" stroke-linecap="round"/><path d="M114 143 Q120 158 127 143 Z" fill="#FF8FB8" ' + st3 + '/>');
    } else {
      add('<circle cx="64" cy="112" r="11" fill="' + P.skin + '" ' + st + '/><circle cx="176" cy="112" r="11" fill="' + P.skin + '" ' + st + '/>');
      add('<ellipse cx="120" cy="100" rx="57" ry="55" fill="' + P.skin + '" ' + st + '/>');
      add('<circle cx="84" cy="126" r="9" fill="#FF8FB8" opacity=".55"/><circle cx="156" cy="126" r="9" fill="#FF8FB8" opacity=".55"/>');
      add(eyes(100, 108, 140, 108, 7.4, 2.8));
      if (mood === 'idle') add('<path d="M89 94 Q100 88 111 93 M129 93 Q140 88 151 94" fill="none" stroke="#111" stroke-width="4.5" stroke-linecap="round"/>');
      add('<path d="M117 119 Q120 123 124 119" fill="none" stroke="#111" stroke-width="3" stroke-linecap="round"/>');
      if (happy) add('<path d="M102 127 Q120 156 138 127 Z" fill="#7A1F2E" ' + st3 + '/><path d="M110 141 Q120 133 130 141 Q120 152 110 141 Z" fill="#FF8FB8"/>');
      else if (mood === 'sleepy') add('<path d="M112 132 Q120 137 128 132" fill="none" stroke="#111" stroke-width="4" stroke-linecap="round"/>');
      else add('<path d="M106 128 Q120 142 134 128" fill="none" stroke="#111" stroke-width="4.5" stroke-linecap="round"/>');
      // hair
      add('<path d="M62 102 C52 50 88 30 122 30 C156 30 190 52 178 102 C172 88 164 78 154 70 C134 84 100 84 84 70 C74 80 66 90 62 102 Z" fill="' + P.hair + '" ' + st + '/>');
      add('<path d="M106 32 C100 18 116 10 128 18 C122 20 122 26 128 32" fill="' + P.hair + '" ' + st3 + '/>');
      add('<path d="M96 54 Q108 46 124 46" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" opacity=".35"/>');
    }
    // glasses / monocle
    if (acc === 'glass') add('<g stroke="#111" stroke-width="4.5" fill="rgba(124,196,255,.35)"><circle cx="' + G.eyeL[0] + '" cy="' + G.eyeL[1] + '" r="17"/><circle cx="' + G.eyeR[0] + '" cy="' + G.eyeR[1] + '" r="17"/><path d="M' + (G.eyeL[0] + 17) + ' ' + G.eyeL[1] + ' L' + (G.eyeR[0] - 17) + ' ' + G.eyeR[1] + '" fill="none"/></g>');
    if (acc === 'mono') add('<g stroke="#111" stroke-width="4.5" fill="rgba(255,255,255,.3)"><circle cx="' + G.eyeR[0] + '" cy="' + G.eyeR[1] + '" r="18"/><path d="M' + (G.eyeR[0] + 14) + ' ' + (G.eyeR[1] + 14) + ' Q' + (G.eyeR[0] + 26) + ' ' + (G.eyeR[1] + 36) + ' ' + (G.eyeR[0] + 12) + ' ' + (G.eyeR[1] + 58) + '" fill="none" stroke-width="3"/></g>');
    // hats
    const hs = 'translate(120 ' + G.hatY + ') scale(' + G.hatS + ')';
    if (hat === 'cap') add('<g transform="' + hs + '"><path d="M-52 4 C-52 -42 -24 -58 0 -58 C26 -58 52 -42 52 4 Z" fill="#7CC4FF" ' + st + '/><path d="M8 -2 C34 -10 68 -8 80 6 C68 18 30 14 8 8 Z" fill="#4AA3E8" ' + st + '/><circle cx="0" cy="-60" r="6" fill="#FFD84D" ' + st3 + '/></g>');
    if (hat === 'chef') add('<g transform="' + hs + '"><circle cx="-28" cy="-34" r="23" fill="#fff" ' + st + '/><circle cx="28" cy="-34" r="23" fill="#fff" ' + st + '/><circle cx="0" cy="-48" r="27" fill="#fff" ' + st + '/><rect x="-44" y="-12" width="88" height="26" rx="8" fill="#fff" ' + st + '/></g>');
    if (hat === 'top') add('<g transform="' + hs + '"><path d="M-40 0 L-36 -70 Q0 -80 36 -70 L40 0 Z" fill="#2B2B2B" ' + st + '/><rect x="-38" y="-28" width="76" height="16" fill="#FFD84D" ' + st3 + '/><ellipse cx="0" cy="0" rx="60" ry="11" fill="#2B2B2B" ' + st + '/></g>');
    if (hat === 'wiz') add('<g transform="' + hs + '"><path d="M-46 0 L-4 -100 Q8 -104 12 -94 L46 0 Z" fill="#8E7CFF" ' + st + '/><ellipse cx="0" cy="0" rx="64" ry="12" fill="#8E7CFF" ' + st + '/><g fill="#FFD84D"><circle cx="-6" cy="-52" r="5"/><circle cx="14" cy="-30" r="4"/><circle cx="-20" cy="-22" r="3.5"/></g></g>');
    if (hat === 'crown') add('<g transform="' + hs + '"><path d="M-50 6 L-54 -46 L-27 -22 L0 -60 L27 -22 L54 -46 L50 6 Z" fill="#FFD84D" ' + st + '/><circle cx="0" cy="-12" r="6" fill="#FF8FB8" ' + st3 + '/><circle cx="-30" cy="-6" r="4.5" fill="#7CC4FF" ' + st3 + '/><circle cx="30" cy="-6" r="4.5" fill="#7BE0A4" ' + st3 + '/></g>');
    if (mood === 'sleepy') add('<text x="176" y="52" font-family="Space Grotesk,Arial,sans-serif" font-weight="700" font-size="30" fill="#111">Z</text><text x="198" y="30" font-family="Space Grotesk,Arial,sans-serif" font-weight="700" font-size="22" fill="#111">z</text>');
    add('</g>');
    return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -50 240 312" width="240" height="312" role="img" aria-label="' + (dog ? 'Chispa, el perro' : 'Nico, el personaje') + '">' + out.join('') + '</svg>';
  }

  renderVals() {
    const st = this.state || {};
    const tab = st.tab || 'win';
    const win = tab === 'win';
    const bars = win
      ? [30, 0, 35, 30, 45, 30, 40, 30, 60, 30, 35, 30, 30, 45, 30, 50, 30, 30, 35, 40, 30, 60, 30, 30, 45, 30, 35, 40, 30, 55]
      : [30, 0, 35, 30, 45, 30, 40, 30, 60, 30, 35, 30, 30, 0, 0, 20, 0, 30, 25, 0, 30, 20, 0, 0, 0, 0, 0, 0, 0, 0];
    const doneDays = win ? 30 : 22;
    const shown = win ? bars : bars.slice(0, 22).concat(Array(8).fill(null));
    const max = 60;
    return {
      tabs: [['win', 'Reto completado'], ['retry', 'Reto sin terminar']].map(([k, l]) => ({ l, on: tab === k, bg: tab === k ? '#111' : '#fff', fg: tab === k ? '#FFF4D6' : '#111', sh: tab === k ? '4px 4px 0 #FFD84D' : 'none', pick: () => this.setState({ tab: k }) })),
      heroBg: win ? '#FFD84D' : '#FFF4D6', charBg: win ? '#FF8FB8' : '#BFE3FF',
      kicker: win ? '30 días de guitarra · reto completado' : '30 días de guitarra · tiempo cumplido',
      title: win ? '¡30 de 30!' : '22 de 30 días.',
      sub: win ? 'Tocas acordes, ritmo y una canción entera. Hace 30 días ni sabías afinar. Eso es lo que hace la constancia.' : 'Eso también cuenta: 22 días más de práctica que el que nunca empezó. No lo cerramos como fallo; elige cómo seguir.',
      chip1: win ? 'Racha máxima: 18 días' : 'Racha máxima: 8 días', chip2: win ? 'Usaste 1 día de gracia' : 'Usaste 2 de 2 días de gracia',
      dog: this.uri(this.buildSvg('dog', win ? { mood: 'celebrate', hat: 'crown', bg: '#FF8FB8' } : { mood: 'sleepy', acc: 'scarf', bg: '#BFE3FF' })),
      dogAlt: win ? 'Chispa celebrando con una corona' : 'Chispa dormida con bufanda',
      stats: win
        ? [{ l: 'Tiempo total', v: '15 h 20 min', s: 'meta del reto: 15 h', bg: '#7CC4FF' }, { l: 'Días cumplidos', v: '30 / 30', s: '100 % de constancia', bg: '#7BE0A4' }, { l: 'Notas escritas', v: '28', s: '2 días sin nota', bg: '#FF9F5A' }, { l: 'Fotos subidas', v: '14', s: 'tu galería está lista', bg: '#FF8FB8' }]
        : [{ l: 'Tiempo total', v: '9 h 40 min', s: 'meta del reto: 15 h', bg: '#7CC4FF' }, { l: 'Días cumplidos', v: '22 / 30', s: '73 % de constancia', bg: '#7BE0A4' }, { l: 'Notas escritas', v: '19', s: 'sigues aprendiendo', bg: '#FF9F5A' }, { l: 'Fotos subidas', v: '9', s: 'todo se conserva', bg: '#FF8FB8' }],
      legend: win ? 'Mejor día: 60 min' : 'Los días vacíos son los que faltan',
      chartAria: win ? 'Barras de minutos practicados en los 30 días' : 'Barras de minutos practicados en 22 días de 30',
      bars: shown.map((m) => ({ h: m === null ? 4 : Math.max(4, Math.round((m / max) * 150)), bg: m === null ? '#E9E4D4' : (m === 0 ? '#7CC4FF' : win ? '#FFD84D' : '#7BE0A4') })),
      rewardTitle: win ? 'Tu recompensa.' : 'Lo que ya ganaste.',
      rewards: win
        ? [{ sym: '+300', t: '300 monedas', s: 'bonus por terminar el reto', bg: '#FFD84D', rot: '-1deg' }, { sym: '★', t: 'Insignia: Guitarrista de 30 días', s: 'Nueva en tu álbum de logros', bg: '#FF8FB8', rot: '1deg' }, { sym: '♛', t: 'Corona exclusiva para Chispa', s: 'Ya está en tu armario', bg: '#7BE0A4', rot: '-.6deg' }]
        : [{ sym: '+110', t: '110 monedas', s: 'por tus 22 días de práctica', bg: '#FFD84D', rot: '-1deg' }, { sym: '9 h', t: '9 h 40 min en Guitarra', s: 'ya suman a tus 10.000 h', bg: '#7CC4FF', rot: '1deg' }, { sym: '✎', t: '19 notas y 9 fotos', s: 'guardadas en tu galería', bg: '#FF9F5A', rot: '-.6deg' }],
      nextTitle: win ? '¿Qué sigue?' : 'Elige cómo seguir.',
      nexts: win
        ? [{ t: 'Repetir el reto', s: 'Otros 30 días, esta vez con una canción nueva.', cta: 'Repetir', bg: '#FFD84D', href: 'PegatinaRetoCrear.dc.html' }, { t: 'Subir a 60 días', s: 'Mismo ritmo, el doble de camino. Conservas tu racha.', cta: 'Subir de nivel', bg: '#7BE0A4', href: 'PegatinaRetoCrear.dc.html' }, { t: 'Ver mi galería', s: 'Compara el día 1 con el día 30.', cta: 'Abrir galería', bg: '#FF8FB8', href: 'PegatinaRetoGaleria.dc.html' }]
        : [{ t: 'Retomar 8 días más', s: 'Extiende el reto hasta completar tus 30 días de práctica.', cta: 'Retomar', bg: '#FFD84D', href: 'PegatinaRetoDetalle.dc.html' }, { t: 'Bajar la meta a 20 min', s: 'Mejor un ritmo que puedas sostener en un mal día.', cta: 'Ajustar meta', bg: '#7BE0A4', href: 'PegatinaRetoCrear.dc.html' }, { t: 'Cerrar y guardar', s: 'Se queda en tus completados. Conservas todo.', cta: 'Cerrar reto', bg: '#fff', href: 'PegatinaRetos.dc.html' }]
    };
  }
}
