<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Oficio — Informe</title>
<script src="./dc-runtime.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font-family:inherit;color:inherit}
button{cursor:pointer}
*{box-sizing:border-box}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.hb{display:inline-flex;align-items:center;gap:8px;height:34px;padding:0 12px;border-radius:4px;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.2);color:#fff;font-size:14px;font-weight:500;transition:background .15s}
.hb:hover{background:rgba(255,255,255,.3)}
.card{background:rgba(255,255,255,.1);border-radius:8px}
.wc{background:#fff;border-radius:8px;color:#555}
.tabw{border:0;background:transparent;color:#fff;font-size:16px;font-weight:400;padding:3px 12px;border-radius:4px;transition:background .15s;opacity:.95}
.tabw:hover{background:rgba(255,255,255,.08)}
.tabw[aria-selected="true"]{background:rgba(0,0,0,.15);font-weight:600}
.go{border:0;background:#fff;border-radius:8px;height:55px;width:200px;font-size:22px;font-weight:700;letter-spacing:.02em;text-transform:uppercase;box-shadow:rgb(235,235,235) 0 6px 0;transition:transform .08s,box-shadow .08s;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.go.on{transform:translateY(6px);box-shadow:none}
.sk{border:0;background:transparent;color:#fff;opacity:.9;width:44px;height:55px;display:grid;place-items:center;border-radius:8px;transition:background .15s}
.sk:hover{background:rgba(255,255,255,.12)}
.task{background:#fff;color:#555;border-radius:8px;padding:16px 18px;display:flex;align-items:center;gap:14px;border-left:6px solid transparent;box-shadow:rgba(0,0,0,.1) 0 1px 1px;cursor:pointer;margin-bottom:8px;transition:border-color .15s;width:100%;text-align:left;font-size:16px;font-weight:600;border-top:0;border-right:0;border-bottom:0}
.task:hover{border-left-color:#e5e5e5}
.task.sel,.task.sel:hover{border-left-color:#222}
.ck{width:22px;height:22px;border-radius:50%;flex:none;display:grid;place-items:center;color:#fff;background:#dfdfdf;border:0;transition:background .15s}
.add{width:100%;height:68px;border-radius:8px;border:2px dashed rgba(255,255,255,.4);background:rgba(0,0,0,.1);color:rgba(255,255,255,.9);font-size:16px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:8px;transition:background .15s}
.add:hover{background:rgba(0,0,0,.16)}
.fld{width:100%;height:44px;border:0;background:#efefef;border-radius:6px;padding:0 12px;font-size:16px;color:#333;font-family:inherit}
textarea.fld{height:auto;padding:12px;resize:vertical;line-height:1.5}
.sw{width:42px;height:24px;border-radius:99px;border:0;position:relative;transition:background .2s;flex:none;cursor:pointer}
.sw::after{content:'';position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 2px rgba(0,0,0,.25)}
.sw[aria-checked="true"]{background:var(--bg)}.sw[aria-checked="true"]::after{transform:translateX(18px)}
.sw[aria-checked="false"]{background:#d4d4d4}
.btnw{background:#fff;color:var(--bg);border:0;border-radius:6px;height:44px;padding:0 22px;font-size:15px;font-weight:700;box-shadow:rgb(235,235,235) 0 4px 0;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .08s,box-shadow .08s}
.btnw:active{transform:translateY(4px);box-shadow:none}
.btnd{background:#222;color:#fff;border:0;border-radius:6px;height:44px;padding:0 22px;font-size:15px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:opacity .15s;cursor:pointer}
.btnd:hover{opacity:.85}
.btnl{background:#efefef;color:#666;border:0;border-radius:6px;height:44px;padding:0 20px;font-size:15px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:background .15s;cursor:pointer}
.btnl:hover{background:#e5e5e5}
.btng{background:rgba(255,255,255,.2);color:#fff;border:1px solid rgba(255,255,255,.2);border-radius:6px;height:44px;padding:0 20px;font-size:15px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:background .15s}
.btng:hover{background:rgba(255,255,255,.3)}
.lbl{display:block;font-size:14px;font-weight:700;color:#aaa;margin-bottom:6px}
.chp{border:0;background:#efefef;color:#777;border-radius:6px;padding:8px 14px;font-size:14px;font-weight:600;transition:background .15s,color .15s;cursor:pointer}
.chp:hover{background:#e5e5e5}
.chp[aria-pressed="true"]{background:#222;color:#fff}
.sep{border-top:1px solid #eee}
.h1w{font-size:30px;font-weight:700;letter-spacing:-.02em;line-height:1.15;margin:0}
.k{color:var(--bg)}
.num{font-variant-numeric:tabular-nums}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,[role=button]:focus-visible{outline:2px solid #fff;outline-offset:2px}
.wc button:focus-visible,.wc input:focus-visible,.wc select:focus-visible,.wc textarea:focus-visible,.wc a:focus-visible{outline-color:#222}

</style>
</helmet>
<div style="min-height:1000px;--bg:#BA4949;background:#BA4949;color:#fff;font-family:'Geist',system-ui,sans-serif;font-size:15px;line-height:1.5;transition:background .4s">
<div style="background:#BA4949;--bg:#BA4949;min-height:1000px;padding:0 20px 80px"><header style="display:flex;align-items:center;justify-content:space-between;max-width:620px;margin:0 auto;height:60px"><a href="PomoTimer.dc.html" style="display:flex;align-items:center;gap:8px;color:#fff;font-size:22px;font-weight:700;letter-spacing:-.02em"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2M9 2h6"/></svg>Oficio</a><nav style="display:flex;gap:8px" aria-label="Principal"><a href="PomoInforme.dc.html" class="hb" style="background:rgba(255,255,255,.35)"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Informe</a><a href="PomoRetos.dc.html" class="hb" style=""><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 21V4M5 4h11l-2 4 2 4H5"/></svg>Retos</a><a href="PomoLogros.dc.html" class="hb" style=""><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 4h8v6a4 4 0 01-8 0zM8 6H4v1a4 4 0 004 4M16 6h4v1a4 4 0 01-4 4M12 14v4M8 21h8"/></svg>Logros</a><a href="PomoTienda.dc.html" class="hb" style=""><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>Tienda</a><a href="PomoAjustes.dc.html" class="hb" aria-label="Ajustes" style="padding:0 9px;"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/></svg></a></nav></header>
<main style="max-width:620px;margin:20px auto 0"><div style="display:flex;justify-content:center;gap:4px;margin-bottom:16px" role="tablist" aria-label="Vista"><sc-for list="{{views}}" as="v" hint-placeholder-count="3"><button type="button" role="tab" class="tabw" aria-selected="{{v.on}}" onClick="{{v.pick}}">{{v.l}}</button></sc-for></div>
<div style="display:{{d0}}"><section class="wc" style="padding:22px 26px 26px" aria-label="Resumen"><h2 style="margin:0 0 18px;text-align:center;font-size:17px;color:#aaa;font-weight:600">Actividad</h2>
<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:12px;text-align:center"><sc-for list="{{kpis}}" as="k" hint-placeholder-count="3"><div style="background:#f6f6f6;border-radius:8px;padding:18px 8px"><div style="font-size:34px;font-weight:700;color:#BA4949;line-height:1.1;font-variant-numeric:tabular-nums">{{k.v}}</div><div style="font-size:13px;color:#999;margin-top:4px">{{k.l}}</div></div></sc-for></div></section>
<section class="wc" style="padding:22px 26px 24px;margin-top:14px" aria-label="Horas por día"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:18px"><h2 style="margin:0;font-size:17px;color:#aaa;font-weight:600">Horas enfocadas</h2><div role="tablist" aria-label="Rango" style="display:flex;gap:2px"><sc-for list="{{ranges}}" as="r" hint-placeholder-count="3"><button type="button" role="tab" aria-selected="{{r.on}}" style="border:0;border-radius:4px;padding:3px 10px;font-size:13px;font-weight:600;background:{{r.bg}};color:{{r.fg}}" onClick="{{r.pick}}">{{r.l}}</button></sc-for></div></div>
<div style="position:relative;height:200px;display:flex;align-items:flex-end;gap:{{gap}}px;border-bottom:1px solid #e6e6e6"><sc-for list="{{grid}}" as="g" hint-placeholder-count="3"><div style="position:absolute;left:0;right:0;bottom:{{g.b}}%;border-top:1px dashed #ececec"><span style="position:absolute;left:-2px;top:-17px;font-size:11px;color:#bbb">{{g.l}}</span></div></sc-for>
<sc-for list="{{bars}}" as="b" hint-placeholder-count="14"><div title="{{b.t}}" style="flex:1;height:{{b.h}}%;background:{{b.bg}};border-radius:3px 3px 0 0;position:relative;transition:height .3s"></div></sc-for></div>
<div style="display:flex;gap:{{gap}}px;margin-top:8px;font-size:11.5px;color:#aaa"><sc-for list="{{bars}}" as="b" hint-placeholder-count="14"><span style="flex:1;text-align:center;white-space:nowrap;overflow:visible">{{b.l}}</span></sc-for></div></section></div>
<section class="wc" style="display:{{d1}};padding:22px 26px" aria-label="Detalle"><h2 style="margin:0 0 8px;font-size:17px;color:#aaa;font-weight:600">Sesiones recientes</h2><sc-for list="{{log}}" as="x" hint-placeholder-count="6"><div style="display:grid;grid-template-columns:90px 1fr auto;gap:14px;padding:14px 0;border-top:1px solid #eee;font-size:15px"><span style="color:#aaa">{{x.d}}</span><span style="font-weight:500">{{x.n}}<span style="display:block;font-size:12.5px;color:#aaa;font-weight:400">{{x.sk}}</span></span><span style="font-weight:700;color:#BA4949;font-variant-numeric:tabular-nums">{{x.t}}</span></div></sc-for></section>
<section class="wc" style="display:{{d2}};padding:22px 26px 10px" aria-label="Ranking"><h2 style="margin:0 0 8px;font-size:17px;color:#aaa;font-weight:600">Tiempo por habilidad</h2><sc-for list="{{rank}}" as="k" hint-placeholder-count="3"><div style="padding:16px 0;border-top:1px solid #eee"><div style="display:flex;justify-content:space-between;align-items:baseline"><span style="font-size:16px;font-weight:600"><span style="color:#ccc;margin-right:8px">{{k.i}}</span>{{k.n}}</span><span style="font-variant-numeric:tabular-nums;font-weight:700;color:#BA4949">{{k.h}} h <span style="color:#bbb;font-weight:500;font-size:13px">· {{k.pct}}</span></span></div><div style="height:8px;border-radius:99px;background:#eee;margin-top:10px"><div style="height:8px;border-radius:99px;background:#BA4949;width:{{k.w}}"></div></div></div></sc-for></section>
</main></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1360,"height":1000}}'>
class Component extends DCLogic {
  renderVals() {
    const s = this.state || {}; const v = s.v ?? 0; const r = s.r ?? 0;
    const pr = (i) => ((i * 37 + 11) % 100) / 100;
    const sets = [
      { n: 7, lab: ['J', 'V', 'S', 'D', 'L', 'M', 'X'], val: [1.5, 2.17, 1.0, 2.5, 1.25, 2.0, 1.83], gap: 18 },
      { n: 30, lab: Array.from({ length: 30 }, (_, i) => (i % 5 === 0 ? String(i + 15 > 31 ? i + 15 - 31 : i + 15) : '')), val: Array.from({ length: 30 }, (_, i) => i < 3 ? 0 : Math.round((0.6 + pr(i) * 2.1) * 100) / 100), gap: 5 },
      { n: 12, lab: ['N', 'D', 'E', 'F', 'M', 'A', 'M', 'J', 'J', 'A', 'S', 'O'], val: [38, 52, 61, 49, 66, 58, 70, 64, 72, 69, 74, 52], gap: 12 }];
    const d = sets[r]; const max = Math.max(...d.val) * 1.1;
    const fmh = (x) => String(x).replace('.', ',');
    const fm = (n) => n >= 1000 ? Math.floor(n / 1000) + '.' + String(n % 1000).padStart(3, '0') : String(n);
    const tick = r === 2 ? 'h/mes' : 'h';
    return {
      views: ['Resumen', 'Detalle', 'Ranking'].map((l, i) => ({ l, on: v === i, pick: () => this.setState({ v: i }) })),
      d0: v === 0 ? 'block' : 'none', d1: v === 1 ? 'block' : 'none', d2: v === 2 ? 'block' : 'none',
      kpis: [{ v: '12,25', l: 'horas esta semana' }, { v: '38', l: 'días activos' }, { v: '12', l: 'días de racha' }],
      ranges: ['Semana', 'Mes', 'Año'].map((l, i) => ({ l, on: r === i, bg: r === i ? '#BA4949' : 'transparent', fg: r === i ? '#fff' : '#999', pick: () => this.setState({ r: i }) })),
      gap: d.gap, grid: [0.5, 1].map(f => ({ b: f * 100 / 1.1 / (1), l: fmh(Math.round(max * f / 1.1 * 10) / 10) + ' ' + tick })).map((g, i) => ({ b: (i + 1) * 45, l: g.l })),
      bars: d.val.map((x, i) => ({ h: Math.max(1.5, x / max * 100), l: d.lab[i], t: fmh(x) + ' ' + (r === 2 ? 'h' : 'h'), bg: (r === 0 && i === 6) || (r === 1 && i === 29) || (r === 2 && i === 11) ? '#BA4949' : '#E3A9A9' })),
      log: [['Hoy 21:30', 'Terminar API de autenticación', 'Programación', '0:20'], ['Hoy 13:05', 'Lectura en inglés: capítulo 5', 'Inglés', '0:40'], ['Hoy 08:40', 'Terminar API de autenticación', 'Programación', '0:25'], ['Hoy 08:10', 'Terminar API de autenticación', 'Programación', '0:25'], ['Ayer 19:15', 'Práctica de acordes', 'Guitarra', '0:30'], ['Ayer 08:00', 'Pruebas unitarias', 'Programación', '1:10']].map(([d, n, sk, t]) => ({ d, n, sk, t })),
      rank: [['Programación', 1284], ['Inglés', 612], ['Guitarra', 244]].map(([n, h], i) => ({ i: String(i + 1), n, h: fm(h), w: (h / 12.84) + '%', pct: Math.round(h / 21.4) / 1 + '% del total' }))
    };
  }
}
</script>
</body>
</html>
