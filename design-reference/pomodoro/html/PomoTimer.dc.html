<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Oficio — Pomodoro</title>
<script src="./dc-runtime.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font-family:inherit;color:inherit}
button{cursor:pointer}
*{box-sizing:border-box}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.hb{display:inline-flex;align-items:center;gap:8px;height:34px;padding:0 12px;border-radius:4px;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.2);color:#fff;font-size:14px;font-weight:500;transition:background .15s}
.hb:hover{background:rgba(255,255,255,.3)}
.card{background:rgba(255,255,255,.1);border-radius:8px}
.wc{background:#fff;border-radius:8px;color:#555}
.tabw{border:0;background:transparent;color:#fff;font-size:16px;font-weight:400;padding:3px 12px;border-radius:4px;transition:background .15s;opacity:.95}
.tabw:hover{background:rgba(255,255,255,.08)}
.tabw[aria-selected="true"]{background:rgba(0,0,0,.15);font-weight:600}
.go{border:0;background:#fff;border-radius:8px;height:55px;width:200px;font-size:22px;font-weight:700;letter-spacing:.02em;text-transform:uppercase;box-shadow:rgb(235,235,235) 0 6px 0;transition:transform .08s,box-shadow .08s;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.go.on{transform:translateY(6px);box-shadow:none}
.sk{border:0;background:transparent;color:#fff;opacity:.9;width:44px;height:55px;display:grid;place-items:center;border-radius:8px;transition:background .15s}
.sk:hover{background:rgba(255,255,255,.12)}
.task{background:#fff;color:#555;border-radius:8px;padding:16px 18px;display:flex;align-items:center;gap:14px;border-left:6px solid transparent;box-shadow:rgba(0,0,0,.1) 0 1px 1px;cursor:pointer;margin-bottom:8px;transition:border-color .15s;width:100%;text-align:left;font-size:16px;font-weight:600;border-top:0;border-right:0;border-bottom:0}
.task:hover{border-left-color:#e5e5e5}
.task.sel,.task.sel:hover{border-left-color:#222}
.ck{width:22px;height:22px;border-radius:50%;flex:none;display:grid;place-items:center;color:#fff;background:#dfdfdf;border:0;transition:background .15s}
.add{width:100%;height:68px;border-radius:8px;border:2px dashed rgba(255,255,255,.4);background:rgba(0,0,0,.1);color:rgba(255,255,255,.9);font-size:16px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:8px;transition:background .15s}
.add:hover{background:rgba(0,0,0,.16)}
.fld{width:100%;height:44px;border:0;background:#efefef;border-radius:6px;padding:0 12px;font-size:16px;color:#333;font-family:inherit}
textarea.fld{height:auto;padding:12px;resize:vertical;line-height:1.5}
.sw{width:42px;height:24px;border-radius:99px;border:0;position:relative;transition:background .2s;flex:none;cursor:pointer}
.sw::after{content:'';position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 2px rgba(0,0,0,.25)}
.sw[aria-checked="true"]{background:var(--bg)}.sw[aria-checked="true"]::after{transform:translateX(18px)}
.sw[aria-checked="false"]{background:#d4d4d4}
.btnw{background:#fff;color:var(--bg);border:0;border-radius:6px;height:44px;padding:0 22px;font-size:15px;font-weight:700;box-shadow:rgb(235,235,235) 0 4px 0;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .08s,box-shadow .08s}
.btnw:active{transform:translateY(4px);box-shadow:none}
.btnd{background:#222;color:#fff;border:0;border-radius:6px;height:44px;padding:0 22px;font-size:15px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:opacity .15s;cursor:pointer}
.btnd:hover{opacity:.85}
.btnl{background:#efefef;color:#666;border:0;border-radius:6px;height:44px;padding:0 20px;font-size:15px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:background .15s;cursor:pointer}
.btnl:hover{background:#e5e5e5}
.btng{background:rgba(255,255,255,.2);color:#fff;border:1px solid rgba(255,255,255,.2);border-radius:6px;height:44px;padding:0 20px;font-size:15px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:background .15s}
.btng:hover{background:rgba(255,255,255,.3)}
.lbl{display:block;font-size:14px;font-weight:700;color:#aaa;margin-bottom:6px}
.chp{border:0;background:#efefef;color:#777;border-radius:6px;padding:8px 14px;font-size:14px;font-weight:600;transition:background .15s,color .15s;cursor:pointer}
.chp:hover{background:#e5e5e5}
.chp[aria-pressed="true"]{background:#222;color:#fff}
.sep{border-top:1px solid #eee}
.h1w{font-size:30px;font-weight:700;letter-spacing:-.02em;line-height:1.15;margin:0}
.k{color:var(--bg)}
.num{font-variant-numeric:tabular-nums}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,[role=button]:focus-visible{outline:2px solid #fff;outline-offset:2px}
.wc button:focus-visible,.wc input:focus-visible,.wc select:focus-visible,.wc textarea:focus-visible,.wc a:focus-visible{outline-color:#222}

</style>
</helmet>
<div style="min-height:1238px;--bg:#BA4949;background:#BA4949;color:#fff;font-family:'Geist',system-ui,sans-serif;font-size:15px;line-height:1.5;transition:background .4s">
<div style="background:{{bg}};--bg:{{bg}};min-height:1238px;transition:background .4s;padding:0 20px 80px"><header style="display:flex;align-items:center;justify-content:space-between;max-width:620px;margin:0 auto;height:60px"><a href="PomoTimer.dc.html" style="display:flex;align-items:center;gap:8px;color:#fff;font-size:22px;font-weight:700;letter-spacing:-.02em"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2M9 2h6"/></svg>Oficio</a><nav style="display:flex;gap:8px" aria-label="Principal"><a href="PomoInforme.dc.html" class="hb" style=""><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Informe</a><a href="PomoRetos.dc.html" class="hb" style=""><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 21V4M5 4h11l-2 4 2 4H5"/></svg>Retos</a><a href="PomoLogros.dc.html" class="hb" style=""><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 4h8v6a4 4 0 01-8 0zM8 6H4v1a4 4 0 004 4M16 6h4v1a4 4 0 01-4 4M12 14v4M8 21h8"/></svg>Logros</a><a href="PomoTienda.dc.html" class="hb" style=""><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>Tienda</a><a href="PomoAjustes.dc.html" class="hb" aria-label="Ajustes" style="padding:0 9px;"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/></svg></a></nav></header>
<div style="max-width:620px;margin:0 auto;height:3px;background:rgba(0,0,0,.1);border-radius:3px;overflow:hidden"><div style="height:100%;width:{{pct}}%;background:rgba(255,255,255,.7);transition:width 1s linear"></div></div>
<main style="max-width:480px;margin:28px auto 0">
<section class="card" style="padding:20px 20px 30px;text-align:center" aria-label="Temporizador">
<div role="tablist" aria-label="Modo" style="display:flex;justify-content:center;gap:4px"><sc-for list="{{tabs}}" as="t" hint-placeholder-count="3"><button type="button" role="tab" class="tabw" aria-selected="{{t.on}}" onClick="{{t.pick}}">{{t.l}}</button></sc-for></div>
<div role="timer" aria-label="Tiempo restante {{time}}" style="font-size:120px;font-weight:700;line-height:1;letter-spacing:-.02em;margin:24px 0 20px;font-variant-numeric:tabular-nums">{{time}}</div>
<div style="display:flex;align-items:center;justify-content:center;gap:12px;position:relative"><button type="button" class="go {{goCls}}" style="color:{{bg}}" onClick="{{toggle}}">{{toggleText}}</button><button type="button" class="sk" aria-label="Saltar" title="Saltar" style="position:absolute;left:calc(50% + 110px);display:{{skipDisp}}" onClick="{{skip}}"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 4l10 8-10 8zM19 5v14"/></svg></button></div></section>
<div style="text-align:center;margin:24px 0 0;opacity:.7;font-size:16px">#{{session}}</div><div style="text-align:center;font-size:18px;font-weight:500;margin-bottom:28px">{{msg}}</div>
<section aria-label="Tareas"><div style="display:flex;align-items:center;justify-content:space-between;border-bottom:2px solid rgba(255,255,255,.6);padding-bottom:14px;margin-bottom:18px"><h2 style="margin:0;font-size:18px;font-weight:600;opacity:.95">Tareas</h2><span style="font-size:14px;opacity:.85">{{summary}}</span></div>
<sc-for list="{{tasks}}" as="t" hint-placeholder-count="3"><div class="task {{t.cls}}" role="button" tabindex="0" aria-pressed="{{t.sel}}" onClick="{{t.pick}}"><button type="button" class="ck" aria-label="Marcar tarea" style="background:{{t.ckbg}}" onClick="{{t.done}}"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"/></svg></button><span style="flex:1;color:{{t.fg}};text-decoration:{{t.td}}">{{t.n}}<span style="display:block;font-size:12.5px;font-weight:500;color:#aaa;text-decoration:none;margin-top:1px">{{t.sk}}</span></span><span style="font-size:15px;color:#aaa;font-weight:700">{{t.cnt}}<span style="font-weight:400;font-size:13px"> / {{t.est}}</span></span></div></sc-for>
<button type="button" class="add" style="display:{{addDisp}}" onClick="{{openAdd}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>Añadir tarea</button>
<div class="wc" style="display:{{formDisp}};padding:16px"><input class="fld" aria-label="Nombre de la tarea" placeholder="¿En qué vas a trabajar?" value="{{newText}}" onChange="{{typing}}"><div style="display:flex;justify-content:flex-end;gap:8px;margin-top:14px"><button type="button" style="border:0;background:transparent;color:#888;font-size:14px;font-weight:600;padding:8px 14px" onClick="{{cancelAdd}}">Cancelar</button><button type="button" style="border:0;background:#222;color:#fff;border-radius:6px;font-size:14px;font-weight:600;padding:8px 18px" onClick="{{saveAdd}}">Guardar</button></div></div></section>
<section class="card" style="margin-top:36px;padding:22px 22px 8px" aria-label="Hacia las 10.000 horas"><div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:14px"><h2 style="margin:0;font-size:16px;font-weight:600">Hacia las 10.000 horas</h2><span style="font-size:13px;opacity:.8">Racha 12 días</span></div>
<sc-for list="{{skills}}" as="k" hint-placeholder-count="3"><div style="padding:12px 0;border-top:1px solid rgba(255,255,255,.18)"><div style="display:flex;justify-content:space-between;font-size:15px;font-weight:500"><span>{{k.n}}</span><span style="font-variant-numeric:tabular-nums">{{k.h}} h</span></div><div style="height:6px;border-radius:99px;background:rgba(0,0,0,.15);margin-top:8px"><div style="height:6px;border-radius:99px;background:#fff;width:{{k.w}}"></div></div></div></sc-for></section>
</main></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"focusMin":{"editor":"int","default":25,"min":1,"max":90,"unit":"min"},"shortMin":{"editor":"int","default":5,"min":1,"max":30,"unit":"min"},"longMin":{"editor":"int","default":15,"min":1,"max":60,"unit":"min"},"$preview":{"width":1360,"height":1238}}'>
class Component extends DCLogic {
  total(m) { return (m === 'focus' ? (this.props.focusMin ?? 25) : m === 'short' ? (this.props.shortMin ?? 5) : (this.props.longMin ?? 15)) * 60; }
  componentDidMount() { this.t = setInterval(() => this.tick(), 1000); }
  componentWillUnmount() { clearInterval(this.t); }
  adv(completed) {
    const s = this.state || {};
    const mode = s.mode || 'focus';
    let done = s.done ?? 1;
    let next = 'focus';
    if (mode === 'focus') { if (completed) done += 1; next = done > 0 && done % 4 === 0 ? 'long' : 'short'; }
    this.setState({ mode: next, left: this.total(next), running: false, done });
  }
  tick() {
    const s = this.state || {};
    if (!s.running) return;
    const left = (s.left ?? this.total(s.mode || 'focus')) - 1;
    if (left > 0) this.setState({ left }); else this.adv(true);
  }
  base() {
    const s = this.state || {};
    const mode = s.mode || 'focus';
    const total = this.total(mode);
    const left = s.left ?? (mode === 'focus' ? total - 427 : total);
    const running = s.running ?? (mode === 'focus' && s.left === undefined ? false : !!s.running);
    const done = s.done ?? 1;
    const skill = s.skill ?? 0;
    const mm = String(Math.floor(left / 60)).padStart(2, '0'), ss = String(left % 60).padStart(2, '0');
    return { s, mode, total, left, running, done, skill, mm, ss, time: mm + ':' + ss, pct: Math.round((1 - left / total) * 100),
      setMode: (m) => this.setState({ mode: m, left: this.total(m), running: false }),
      toggle: () => this.setState({ running: !running, left }),
      reset: () => this.setState({ left: total, running: false }),
      skip: () => this.adv(false), pickSkill: (i) => this.setState({ skill: i }) };
  }
  renderVals() {
    const b = this.base(); const s = b.s; const bgs = {"focus": "#BA4949", "short": "#38858A", "long": "#397097"};
    const names = ['Programación', 'Inglés', 'Guitarra'];
    const tasks = s.tasks ?? [{ n: 'Terminar API de autenticación', sk: 'Programación', est: 4, act: 2, ok: false }, { n: 'Lectura en inglés: capítulo 5', sk: 'Inglés', est: 2, act: 2, ok: true }, { n: 'Escala pentatónica y una nota', sk: 'Guitarra', est: 2, act: 0, ok: false }];
    const sel = s.sel ?? 0; const adding = !!s.adding;
    const save = (t) => this.setState({ tasks: t });
    const fm = (n) => n >= 1000 ? Math.floor(n / 1000) + '.' + String(n % 1000).padStart(3, '0') : String(n);
    const act = (t, i) => t.act + (i === sel && !t.ok ? (b.done - 1) : 0);
    const totalEst = tasks.reduce((a, t) => a + t.est, 0), totalAct = tasks.reduce((a, t, i) => a + act(t, i), 0);
    return {
      bg: bgs[b.mode], time: b.time, pct: b.pct, session: String(b.done + (b.mode === 'focus' ? 1 : 0)), msg: b.mode === 'focus' ? (tasks[sel] ? tasks[sel].n : '¡Hora de enfocar!') : '¡Hora de descansar!',
      tabs: [['focus', 'Foco'], ['short', 'Descanso corto'], ['long', 'Descanso largo']].map(([id, l]) => ({ l, on: b.mode === id, pick: () => b.setMode(id) })),
      toggle: b.toggle, toggleText: b.running ? 'Pausar' : 'Empezar', goCls: b.running ? 'on' : '', skipDisp: b.running ? 'grid' : 'none', skip: b.skip,
      summary: 'Sesiones: ' + totalAct + ' / ' + totalEst,
      tasks: tasks.map((t, i) => ({ n: t.n, sk: t.sk, est: t.est, cnt: act(t, i), cls: i === sel ? 'sel' : '', sel: i === sel, fg: t.ok ? '#bbb' : '#555', td: t.ok ? 'line-through' : 'none', ckbg: t.ok ? bgs[b.mode] : '#dfdfdf',
        pick: () => this.setState({ sel: i }), done: (e) => { e && e.stopPropagation && e.stopPropagation(); save(tasks.map((x, j) => j === i ? { ...x, ok: !x.ok } : x)); } })),
      addDisp: adding ? 'none' : 'flex', formDisp: adding ? 'block' : 'none', openAdd: () => this.setState({ adding: true }), cancelAdd: () => this.setState({ adding: false, newText: '' }),
      newText: s.newText ?? '', typing: (e) => this.setState({ newText: e.target.value }),
      saveAdd: () => { const v = (s.newText || '').trim(); if (!v) return this.setState({ adding: false }); this.setState({ tasks: [...tasks, { n: v, sk: tasks[sel] ? tasks[sel].sk : names[0], est: 1, act: 0, ok: false }], adding: false, newText: '' }); },
      skills: [['Programación', 1284], ['Inglés', 612], ['Guitarra', 244]].map(([n, h]) => ({ n, h: fm(h), w: (h / 100) + '%' }))
    };
  }
}
</script>
</body>
</html>
