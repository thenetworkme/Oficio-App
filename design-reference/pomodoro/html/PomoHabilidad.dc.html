<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Oficio — Habilidad</title>
<script src="./dc-runtime.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font-family:inherit;color:inherit}
button{cursor:pointer}
*{box-sizing:border-box}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.hb{display:inline-flex;align-items:center;gap:8px;height:34px;padding:0 12px;border-radius:4px;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.2);color:#fff;font-size:14px;font-weight:500;transition:background .15s}
.hb:hover{background:rgba(255,255,255,.3)}
.card{background:rgba(255,255,255,.1);border-radius:8px}
.wc{background:#fff;border-radius:8px;color:#555}
.tabw{border:0;background:transparent;color:#fff;font-size:16px;font-weight:400;padding:3px 12px;border-radius:4px;transition:background .15s;opacity:.95}
.tabw:hover{background:rgba(255,255,255,.08)}
.tabw[aria-selected="true"]{background:rgba(0,0,0,.15);font-weight:600}
.go{border:0;background:#fff;border-radius:8px;height:55px;width:200px;font-size:22px;font-weight:700;letter-spacing:.02em;text-transform:uppercase;box-shadow:rgb(235,235,235) 0 6px 0;transition:transform .08s,box-shadow .08s;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.go.on{transform:translateY(6px);box-shadow:none}
.sk{border:0;background:transparent;color:#fff;opacity:.9;width:44px;height:55px;display:grid;place-items:center;border-radius:8px;transition:background .15s}
.sk:hover{background:rgba(255,255,255,.12)}
.task{background:#fff;color:#555;border-radius:8px;padding:16px 18px;display:flex;align-items:center;gap:14px;border-left:6px solid transparent;box-shadow:rgba(0,0,0,.1) 0 1px 1px;cursor:pointer;margin-bottom:8px;transition:border-color .15s;width:100%;text-align:left;font-size:16px;font-weight:600;border-top:0;border-right:0;border-bottom:0}
.task:hover{border-left-color:#e5e5e5}
.task.sel,.task.sel:hover{border-left-color:#222}
.ck{width:22px;height:22px;border-radius:50%;flex:none;display:grid;place-items:center;color:#fff;background:#dfdfdf;border:0;transition:background .15s}
.add{width:100%;height:68px;border-radius:8px;border:2px dashed rgba(255,255,255,.4);background:rgba(0,0,0,.1);color:rgba(255,255,255,.9);font-size:16px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:8px;transition:background .15s}
.add:hover{background:rgba(0,0,0,.16)}
.fld{width:100%;height:44px;border:0;background:#efefef;border-radius:6px;padding:0 12px;font-size:16px;color:#333;font-family:inherit}
textarea.fld{height:auto;padding:12px;resize:vertical;line-height:1.5}
.sw{width:42px;height:24px;border-radius:99px;border:0;position:relative;transition:background .2s;flex:none;cursor:pointer}
.sw::after{content:'';position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 2px rgba(0,0,0,.25)}
.sw[aria-checked="true"]{background:var(--bg)}.sw[aria-checked="true"]::after{transform:translateX(18px)}
.sw[aria-checked="false"]{background:#d4d4d4}
.btnw{background:#fff;color:var(--bg);border:0;border-radius:6px;height:44px;padding:0 22px;font-size:15px;font-weight:700;box-shadow:rgb(235,235,235) 0 4px 0;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .08s,box-shadow .08s}
.btnw:active{transform:translateY(4px);box-shadow:none}
.btnd{background:#222;color:#fff;border:0;border-radius:6px;height:44px;padding:0 22px;font-size:15px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:opacity .15s;cursor:pointer}
.btnd:hover{opacity:.85}
.btnl{background:#efefef;color:#666;border:0;border-radius:6px;height:44px;padding:0 20px;font-size:15px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:background .15s;cursor:pointer}
.btnl:hover{background:#e5e5e5}
.btng{background:rgba(255,255,255,.2);color:#fff;border:1px solid rgba(255,255,255,.2);border-radius:6px;height:44px;padding:0 20px;font-size:15px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:background .15s}
.btng:hover{background:rgba(255,255,255,.3)}
.lbl{display:block;font-size:14px;font-weight:700;color:#aaa;margin-bottom:6px}
.chp{border:0;background:#efefef;color:#777;border-radius:6px;padding:8px 14px;font-size:14px;font-weight:600;transition:background .15s,color .15s;cursor:pointer}
.chp:hover{background:#e5e5e5}
.chp[aria-pressed="true"]{background:#222;color:#fff}
.sep{border-top:1px solid #eee}
.h1w{font-size:30px;font-weight:700;letter-spacing:-.02em;line-height:1.15;margin:0}
.k{color:var(--bg)}
.num{font-variant-numeric:tabular-nums}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,[role=button]:focus-visible{outline:2px solid #fff;outline-offset:2px}
.wc button:focus-visible,.wc input:focus-visible,.wc select:focus-visible,.wc textarea:focus-visible,.wc a:focus-visible{outline-color:#222}

</style>
</helmet>
<div style="min-height:1035px;--bg:#BA4949;background:#BA4949;color:#fff;font-family:'Geist',system-ui,sans-serif;font-size:15px;line-height:1.5;transition:background .4s">
<div style="background:#BA4949;--bg:#BA4949;min-height:1035px;padding:0 20px 80px"><header style="display:flex;align-items:center;justify-content:space-between;max-width:620px;margin:0 auto;height:60px"><a href="PomoTimer.dc.html" style="display:flex;align-items:center;gap:8px;color:#fff;font-size:22px;font-weight:700;letter-spacing:-.02em"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2M9 2h6"/></svg>Oficio</a><nav style="display:flex;gap:8px" aria-label="Principal"><a href="PomoInforme.dc.html" class="hb" style=""><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Informe</a><a href="PomoRetos.dc.html" class="hb" style=""><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 21V4M5 4h11l-2 4 2 4H5"/></svg>Retos</a><a href="PomoLogros.dc.html" class="hb" style=""><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 4h8v6a4 4 0 01-8 0zM8 6H4v1a4 4 0 004 4M16 6h4v1a4 4 0 01-4 4M12 14v4M8 21h8"/></svg>Logros</a><a href="PomoTienda.dc.html" class="hb" style=""><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>Tienda</a><a href="PomoAjustes.dc.html" class="hb" aria-label="Ajustes" style="padding:0 9px;"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/></svg></a></nav></header><main style="max-width:620px;margin:24px auto 0"><div role="tablist" aria-label="Habilidad" style="display:flex;gap:4px;margin-bottom:16px"><sc-for list="{{tabs}}" as="t" hint-placeholder-count="3"><button type="button" role="tab" class="tabw" aria-selected="{{t.on}}" onClick="{{t.pick}}">{{t.n}}</button></sc-for></div>
<section class="wc" style="padding:26px 28px 28px"><div style="display:flex;justify-content:space-between;align-items:flex-start"><div><div style="font-size:14px;font-weight:700;color:#aaa">{{name}}</div><div class="num" style="font-size:64px;font-weight:800;color:#BA4949;line-height:1;margin-top:6px;letter-spacing:-.03em">{{hours}}<span style="font-size:22px;color:#bbb;font-weight:600"> / 10.000 h</span></div></div><div style="text-align:right;font-size:13px;color:#aaa">Proyección<div style="font-size:20px;font-weight:700;color:#555">{{years}} años</div></div></div>
<div style="position:relative;margin:26px 0 10px"><div style="height:10px;border-radius:99px;background:#eee"><div style="height:10px;border-radius:99px;background:#BA4949;width:{{w}}"></div></div><sc-for list="{{marks}}" as="m" hint-placeholder-count="4"><i style="position:absolute;top:-3px;left:{{m.l}};width:2px;height:16px;background:{{m.bg}}"></i></sc-for></div>
<div style="display:flex;justify-content:space-between;font-size:12px;color:#bbb"><span>0</span><span>1.000</span><span>5.000</span><span>10.000</span></div>
<div style="display:flex;gap:10px;margin-top:22px"><a href="PomoTimer.dc.html" class="btnd" style="flex:1"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 4l13 8-13 8z"/></svg>Practicar ahora</a><a href="PomoRegistro.dc.html" class="btnl">Registrar horas</a></div></section>
<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px"><sc-for list="{{kpis}}" as="k" hint-placeholder-count="3"><div class="card" style="padding:16px 18px"><div class="num" style="font-size:28px;font-weight:700;line-height:1.1">{{k.v}}</div><div style="font-size:13px;opacity:.85;margin-top:2px">{{k.l}}</div></div></sc-for></div>
<section class="wc" style="padding:22px 26px 20px;margin-top:12px"><div style="font-size:14px;font-weight:700;color:#aaa;margin-bottom:14px">Últimos 14 días</div><div style="display:flex;align-items:flex-end;gap:6px;height:110px;border-bottom:1px solid #eee"><sc-for list="{{bars}}" as="b" hint-placeholder-count="14"><div title="{{b.t}}" style="flex:1;height:{{b.h}}%;background:{{b.bg}};border-radius:3px 3px 0 0"></div></sc-for></div></section>
<section class="wc" style="padding:18px 26px 6px;margin-top:12px"><div style="font-size:14px;font-weight:700;color:#aaa;margin-bottom:4px">Sesiones recientes</div><sc-for list="{{log}}" as="x" hint-placeholder-count="4"><div style="display:grid;grid-template-columns:100px 1fr auto;gap:12px;padding:13px 0;border-top:1px solid #eee"><span style="color:#aaa">{{x.d}}</span><span style="font-weight:500;color:#555">{{x.n}}</span><span class="num" style="font-weight:700;color:#BA4949">{{x.t}}</span></div></sc-for></section></main></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1360,"height":1035}}'>
class Component extends DCLogic {
  renderVals() {
    const s = this.state || {}; const g = (k, d) => s[k] ?? d; const set = (k) => (e) => this.setState({ [k]: e.target.value }); const fm = (n) => n >= 1000 ? Math.floor(n / 1000) + "." + String(n % 1000).padStart(3, "0") : String(n);
const i = g('i', 0); const D = [
      { n: 'Programación', h: 1284, kp: ['8 h 40', '12 días', '1 h 48'], log: [['Hoy 21:30', 'Terminar API de autenticación', '0:20'], ['Hoy 08:40', 'Terminar API de autenticación', '0:25'], ['Hoy 08:10', 'Terminar API de autenticación', '0:25'], ['Ayer 08:00', 'Pruebas unitarias', '1:10']], m: [95, 110, 80, 130, 120, 60, 100, 125, 90, 140, 70, 115, 105, 65], min: 108 },
      { n: 'Inglés', h: 612, kp: ['3 h 20', '9 días', '0 h 42'], log: [['Hoy 13:05', 'Lectura: capítulo 5', '0:40'], ['Ayer 12:30', 'Podcast + notas', '0:45'], ['Lun 07:50', 'Vocabulario', '0:30'], ['Dom 20:00', 'Conversación', '0:50']], m: [30, 45, 0, 40, 50, 35, 0, 45, 40, 30, 55, 40, 45, 40], min: 42 },
      { n: 'Guitarra', h: 244, kp: ['1 h 30', '5 días', '0 h 28'], log: [['Ayer 19:15', 'Práctica de acordes', '0:30'], ['Lun 19:00', 'Escala pentatónica', '0:30'], ['Dom 18:40', 'Canción nueva', '0:25'], ['Sáb 19:10', 'Ritmo y metrónomo', '0:30']], m: [0, 0, 20, 30, 0, 25, 35, 30, 0, 40, 30, 30, 25, 30], min: 28 }][i];
    const mx = Math.max(...D.m) * 1.1; const years = ((10000 - D.h) / (Math.max(D.min, 20) * 6 * 52 / 60)).toFixed(1).replace('.', ',');
    return { tabs: ['Programación', 'Inglés', 'Guitarra'].map((n, k) => ({ n, on: i === k, pick: () => this.setState({ i: k }) })), name: D.n, hours: fm(D.h), years, w: (D.h / 100) + '%',
      marks: [10, 50].map(p => ({ l: p + '%', bg: '#ddd' })), kpis: [['Esta semana', D.kp[0]], ['Racha', D.kp[1]], ['Promedio diario', D.kp[2]]].map(([l, v], k) => ({ l, v: D.kp[k] })).map((x, k) => ({ v: x.v, l: ['esta semana', 'de racha', 'por día'][k] })),
      bars: D.m.map((v, k) => ({ h: Math.max(2, v / mx * 100), t: v + ' min', bg: k === 13 ? '#BA4949' : '#E3A9A9' })), log: D.log.map(([d, n, t]) => ({ d, n, t })) };
  }
}
</script>
</body>
</html>
