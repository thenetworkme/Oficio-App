<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Punto — Foco, modo zen</title>
<script src="./dc-runtime.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&amp;family=Geist+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font-family:inherit;color:inherit}
button{cursor:pointer}
*{box-sizing:border-box}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.mono{font-family:'Geist Mono',ui-monospace,monospace;letter-spacing:.04em}
.lab{font-family:'Geist Mono',ui-monospace,monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#8A8A90}
.dot{aspect-ratio:1/1;border-radius:50%;transition:background .2s}
.tab{font-family:'Geist Mono',monospace;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:#8A8A90;padding:24px 0;position:relative;transition:color .15s}
.tab:hover{color:#F4F4F1}
.tab[aria-current="page"]{color:#F4F4F1}
.tab[aria-current="page"]::before{content:'';position:absolute;left:-14px;top:50%;width:6px;height:6px;margin-top:-3px;border-radius:50%;background:#FF4A1C}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:12px;height:52px;padding:0 26px;border-radius:999px;border:1px solid #3A3A3F;background:transparent;color:#F4F4F1;font-family:'Geist Mono',monospace;font-size:12px;letter-spacing:.12em;text-transform:uppercase;transition:background .15s,border-color .15s,transform .15s;white-space:nowrap}
.btn:hover{background:#17171A;border-color:#55555B}
.btn.sig{background:#FF4A1C;border-color:#FF4A1C;color:#0A0A0B;font-weight:500}
.btn.sig:hover{background:#FF6038;transform:translateY(-1px)}
.btn.sm{height:40px;padding:0 18px;font-size:11px}
.btn.danger{border-color:#7A2A18;color:#FF6A47}
.btn.danger:hover{background:#1A0E0B;border-color:#FF4A1C}
.opt{font-family:'Geist Mono',monospace;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:#6E6E74;background:none;border:0;padding:0;transition:color .15s;display:inline-flex;gap:8px;align-items:center}
.opt:hover{color:#F4F4F1}
.opt[aria-pressed="true"]{color:#F4F4F1}
.opt[aria-pressed="true"]::before{content:'';width:6px;height:6px;border-radius:50%;background:#FF4A1C}
.chip{font-family:'Geist Mono',monospace;font-size:12px;letter-spacing:.1em;text-transform:uppercase;border:1px solid #3A3A3F;border-radius:999px;padding:9px 18px;background:transparent;color:#8A8A90;transition:all .15s}
.chip:hover{border-color:#6E6E74;color:#F4F4F1}
.chip[aria-pressed="true"]{background:#F4F4F1;border-color:#F4F4F1;color:#0A0A0B}
.inp{width:100%;background:transparent;border:0;border-bottom:1px solid #3A3A3F;color:#F4F4F1;font-size:18px;padding:8px 0 12px;font-family:inherit;transition:border-color .15s;border-radius:0}
.inp::placeholder{color:#55555B}
.inp:focus{outline:none;border-bottom-color:#FF4A1C}
textarea.inp{border:1px solid #2E2E33;border-radius:14px;padding:14px 16px;min-height:130px;resize:vertical;line-height:1.55;font-size:16px}
textarea.inp:focus{border-color:#FF4A1C}
.tg{width:48px;height:28px;border-radius:999px;border:1px solid #3A3A3F;background:transparent;position:relative;transition:border-color .2s;flex:none}
.tg::after{content:'';position:absolute;top:5px;left:5px;width:16px;height:16px;border-radius:50%;background:#6E6E74;transition:transform .2s,background .2s}
.tg[aria-pressed="true"]{border-color:#FF4A1C}
.tg[aria-pressed="true"]::after{transform:translateX(20px);background:#FF4A1C}
.sq{width:44px;height:44px;border-radius:50%;border:1px solid #3A3A3F;background:transparent;color:#F4F4F1;font-size:20px;line-height:1;transition:background .15s,border-color .15s;flex:none}
.sq:hover{background:#17171A;border-color:#55555B}
.row{display:grid;align-items:center;gap:24px;padding:20px 0;border-top:1px solid #232326}
.box{border:1px solid #232326;border-radius:22px;padding:28px}
.link{color:#8A8A90;border-bottom:1px solid #3A3A3F;transition:color .15s}
.link:hover{color:#F4F4F1}
.dd{display:flex;gap:6px}
.dd button{width:34px;height:34px;border-radius:50%;border:1px solid #3A3A3F;background:transparent;color:#6E6E74;font-family:'Geist Mono',monospace;font-size:11px;transition:all .15s}
.dd button[aria-pressed="true"]{background:#F4F4F1;border-color:#F4F4F1;color:#0A0A0B}
.kp>div:first-child{border-left:0!important;padding-left:0!important}
a:focus-visible,button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid #FF4A1C;outline-offset:3px}
@keyframes blink{50%{opacity:.15}}
@keyframes breathe{0%,100%{transform:scale(.62);opacity:.7}50%{transform:scale(1);opacity:1}}
@keyframes pop{from{opacity:0;transform:translateY(8px)}}
.pop{animation:pop .4s ease both}

</style>
</helmet>
<div style="min-height:900px;background:#0A0A0B;color:#F4F4F1;font-family:'Geist',system-ui,sans-serif;font-size:15px;line-height:1.5">
<div style="min-height:900px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;position:relative"><div role="timer" aria-label="Tiempo restante {{time}}" style="{{gridStyle}};width:1200px"><sc-for list="{{dots}}" as="d" hint-placeholder-count="175"><i class="dot" style="background:{{d.bg}};animation:{{d.an}}"></i></sc-for></div>
<div style="position:absolute;bottom:40px;left:0;right:0;display:flex;justify-content:center;gap:32px" class="lab"><button type="button" class="opt" onClick="{{toggle}}" style="font-size:11px">Espacio · {{toggleText}}</button><a href="PuntoFoco.dc.html" class="opt" style="font-size:11px">Salir del modo zen</a></div></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"focusMin":{"editor":"int","default":25,"min":1,"max":90,"unit":"min"},"shortMin":{"editor":"int","default":5,"min":1,"max":30,"unit":"min"},"longMin":{"editor":"int","default":15,"min":1,"max":60,"unit":"min"},"$preview":{"width":1360,"height":900}}'>
class Component extends DCLogic {
  total(m) { return (m === 'focus' ? (this.props.focusMin ?? 25) : m === 'short' ? (this.props.shortMin ?? 5) : (this.props.longMin ?? 15)) * 60; }
  componentDidMount() { this.t = setInterval(() => this.tick(), 1000); this.setState({ mode: 'focus', left: this.total('focus') - 427, running: true }); }
  componentWillUnmount() { clearInterval(this.t); }
  adv(completed) {
    const s = this.state || {};
    const mode = s.mode || 'focus';
    let done = s.done ?? 1;
    let next = 'focus';
    if (mode === 'focus') { if (completed) done += 1; next = done > 0 && done % 4 === 0 ? 'long' : 'short'; }
    this.setState({ mode: next, left: this.total(next), running: false, done });
  }
  tick() {
    const s = this.state || {};
    if (!s.running) return;
    const left = (s.left ?? this.total(s.mode || 'focus')) - 1;
    if (left > 0) this.setState({ left }); else this.adv(true);
  }
  base() {
    const s = this.state || {};
    const mode = s.mode || 'focus';
    const total = this.total(mode);
    const left = s.left ?? (mode === 'focus' ? total - 427 : total);
    const running = s.running ?? (mode === 'focus' && s.left === undefined ? false : !!s.running);
    const done = s.done ?? 1;
    const skill = s.skill ?? 0;
    const mm = String(Math.floor(left / 60)).padStart(2, '0'), ss = String(left % 60).padStart(2, '0');
    return { s, mode, total, left, running, done, skill, mm, ss, time: mm + ':' + ss, pct: Math.round((1 - left / total) * 100),
      setMode: (m) => this.setState({ mode: m, left: this.total(m), running: false }),
      toggle: () => this.setState({ running: !running, left }),
      reset: () => this.setState({ left: total, running: false }),
      skip: () => this.adv(false), pickSkill: (i) => this.setState({ skill: i }) };
  }
  dm(str, on, off, sig, running) {
    const G = { '0': ['01110', '10001', '10011', '10101', '11001', '10001', '01110'], '1': ['00100', '01100', '00100', '00100', '00100', '00100', '01110'], '2': ['01110', '10001', '00001', '00010', '00100', '01000', '11111'], '3': ['11110', '00001', '00001', '01110', '00001', '00001', '11110'], '4': ['00010', '00110', '01010', '10010', '11111', '00010', '00010'], '5': ['11111', '10000', '11110', '00001', '00001', '10001', '01110'], '6': ['00110', '01000', '10000', '11110', '10001', '10001', '01110'], '7': ['11111', '00001', '00010', '00100', '01000', '01000', '01000'], '8': ['01110', '10001', '10001', '01110', '10001', '10001', '01110'], '9': ['01110', '10001', '10001', '01111', '00001', '00010', '01100'], ':': ['0', '0', '1', '0', '1', '0', '0'], '/': ['00001', '00010', '00010', '00100', '01000', '01000', '10000'], '+': ['0', '0', '0', '0', '0', '0', '0'] };
    const cols = [];
    str.split('').forEach((ch, i) => { const g = G[ch]; for (let c = 0; c < g[0].length; c++) cols.push({ colon: ch === ':', rows: g.map(r => r[c] === '1') }); if (i < str.length - 1) cols.push({ colon: false, rows: Array(7).fill(false) }); });
    const dots = [];
    for (let r = 0; r < 7; r++) for (let c = 0; c < cols.length; c++) { const lit = cols[c].rows[r]; const colon = cols[c].colon; dots.push({ bg: lit ? (colon ? sig : on) : off, an: colon && lit && running ? 'blink 1s steps(1) infinite' : 'none' }); }
    return { dots, n: cols.length };
  }
  renderVals() {
    const b = this.base(); const m = this.dm(b.time, '#E9E9E4', '#101012', '#FF4A1C', b.running);
    return { dots: m.dots, gridStyle: 'display:grid;grid-template-columns:repeat(' + m.n + ',1fr);gap:10px', time: b.time, toggle: b.toggle, toggleText: b.running ? 'Pausar' : 'Seguir' };
  }
}
</script>
</body>
</html>
