<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Punto — Galería y diario</title>
<script src="./dc-runtime.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&amp;family=Geist+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font-family:inherit;color:inherit}
button{cursor:pointer}
*{box-sizing:border-box}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.mono{font-family:'Geist Mono',ui-monospace,monospace;letter-spacing:.04em}
.lab{font-family:'Geist Mono',ui-monospace,monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#8A8A90}
.dot{aspect-ratio:1/1;border-radius:50%;transition:background .2s}
.tab{font-family:'Geist Mono',monospace;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:#8A8A90;padding:24px 0;position:relative;transition:color .15s}
.tab:hover{color:#F4F4F1}
.tab[aria-current="page"]{color:#F4F4F1}
.tab[aria-current="page"]::before{content:'';position:absolute;left:-14px;top:50%;width:6px;height:6px;margin-top:-3px;border-radius:50%;background:#FF4A1C}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:12px;height:52px;padding:0 26px;border-radius:999px;border:1px solid #3A3A3F;background:transparent;color:#F4F4F1;font-family:'Geist Mono',monospace;font-size:12px;letter-spacing:.12em;text-transform:uppercase;transition:background .15s,border-color .15s,transform .15s;white-space:nowrap}
.btn:hover{background:#17171A;border-color:#55555B}
.btn.sig{background:#FF4A1C;border-color:#FF4A1C;color:#0A0A0B;font-weight:500}
.btn.sig:hover{background:#FF6038;transform:translateY(-1px)}
.btn.sm{height:40px;padding:0 18px;font-size:11px}
.btn.danger{border-color:#7A2A18;color:#FF6A47}
.btn.danger:hover{background:#1A0E0B;border-color:#FF4A1C}
.opt{font-family:'Geist Mono',monospace;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:#6E6E74;background:none;border:0;padding:0;transition:color .15s;display:inline-flex;gap:8px;align-items:center}
.opt:hover{color:#F4F4F1}
.opt[aria-pressed="true"]{color:#F4F4F1}
.opt[aria-pressed="true"]::before{content:'';width:6px;height:6px;border-radius:50%;background:#FF4A1C}
.chip{font-family:'Geist Mono',monospace;font-size:12px;letter-spacing:.1em;text-transform:uppercase;border:1px solid #3A3A3F;border-radius:999px;padding:9px 18px;background:transparent;color:#8A8A90;transition:all .15s}
.chip:hover{border-color:#6E6E74;color:#F4F4F1}
.chip[aria-pressed="true"]{background:#F4F4F1;border-color:#F4F4F1;color:#0A0A0B}
.inp{width:100%;background:transparent;border:0;border-bottom:1px solid #3A3A3F;color:#F4F4F1;font-size:18px;padding:8px 0 12px;font-family:inherit;transition:border-color .15s;border-radius:0}
.inp::placeholder{color:#55555B}
.inp:focus{outline:none;border-bottom-color:#FF4A1C}
textarea.inp{border:1px solid #2E2E33;border-radius:14px;padding:14px 16px;min-height:130px;resize:vertical;line-height:1.55;font-size:16px}
textarea.inp:focus{border-color:#FF4A1C}
.tg{width:48px;height:28px;border-radius:999px;border:1px solid #3A3A3F;background:transparent;position:relative;transition:border-color .2s;flex:none}
.tg::after{content:'';position:absolute;top:5px;left:5px;width:16px;height:16px;border-radius:50%;background:#6E6E74;transition:transform .2s,background .2s}
.tg[aria-pressed="true"]{border-color:#FF4A1C}
.tg[aria-pressed="true"]::after{transform:translateX(20px);background:#FF4A1C}
.sq{width:44px;height:44px;border-radius:50%;border:1px solid #3A3A3F;background:transparent;color:#F4F4F1;font-size:20px;line-height:1;transition:background .15s,border-color .15s;flex:none}
.sq:hover{background:#17171A;border-color:#55555B}
.row{display:grid;align-items:center;gap:24px;padding:20px 0;border-top:1px solid #232326}
.box{border:1px solid #232326;border-radius:22px;padding:28px}
.link{color:#8A8A90;border-bottom:1px solid #3A3A3F;transition:color .15s}
.link:hover{color:#F4F4F1}
.dd{display:flex;gap:6px}
.dd button{width:34px;height:34px;border-radius:50%;border:1px solid #3A3A3F;background:transparent;color:#6E6E74;font-family:'Geist Mono',monospace;font-size:11px;transition:all .15s}
.dd button[aria-pressed="true"]{background:#F4F4F1;border-color:#F4F4F1;color:#0A0A0B}
.kp>div:first-child{border-left:0!important;padding-left:0!important}
a:focus-visible,button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid #FF4A1C;outline-offset:3px}
@keyframes blink{50%{opacity:.15}}
@keyframes breathe{0%,100%{transform:scale(.62);opacity:.7}50%{transform:scale(1);opacity:1}}
@keyframes pop{from{opacity:0;transform:translateY(8px)}}
.pop{animation:pop .4s ease both}

</style>
</helmet>
<div style="min-height:900px;background:#0A0A0B;color:#F4F4F1;font-family:'Geist',system-ui,sans-serif;font-size:15px;line-height:1.5">
<header style="display:flex;align-items:center;padding:0 40px;height:68px;border-bottom:1px solid #232326"><a href="PuntoPanel.dc.html" style="flex:1;font-weight:600;font-size:20px;letter-spacing:-.02em;display:flex;align-items:center;gap:3px">oficio<i style="width:7px;height:7px;border-radius:50%;background:#FF4A1C;margin-top:9px"></i></a><nav aria-label="Principal" style="display:flex;gap:32px;padding-left:14px"><a class="tab" href="PuntoPanel.dc.html" >Hoy</a><a class="tab" href="PuntoTimer.dc.html" >Práctica</a><a class="tab" href="PuntoStats.dc.html" >Datos</a><a class="tab" href="PuntoRetos.dc.html" aria-current="page">Retos</a><a class="tab" href="PuntoLogros.dc.html" >Logros</a><a class="tab" href="PuntoTienda.dc.html" >Tienda</a></nav><div style="flex:1;display:flex;justify-content:flex-end;align-items:center;gap:16px"><span class="lab">Mié 14.10.2026</span><a href="PuntoAvisos.dc.html" aria-label="Avisos" style="color:#8A8A90;position:relative;display:flex"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 16V11a6 6 0 0112 0v5l2 2H4zM10 21h4"/></svg><i style="position:absolute;right:-1px;top:-1px;width:6px;height:6px;border-radius:50%;background:#FF4A1C"></i></a><a href="PuntoAjustes.dc.html" aria-label="Ajustes" style="width:34px;height:34px;border-radius:50%;border:1px solid #3A3A3F;display:flex;align-items:center;justify-content:center;font-family:'Geist Mono',monospace;font-size:12px">K</a></div></header><main style="padding:0 40px 64px"><div style="padding:44px 0 34px;display:flex;align-items:flex-end;gap:32px;flex-wrap:wrap"><div style="flex:1;min-width:320px"><a href="PuntoRetoDetalle.dc.html" class="lab link" style="display:inline-block;margin-bottom:18px;border:0">← Detalle del reto</a><br><div class="lab" style="margin-bottom:14px">Reto · 30 días de guitarra</div><h1 style="margin:0;font-size:76px;font-weight:300;letter-spacing:-.05em;line-height:.95">Galería y diario</h1></div><div style="display:flex;gap:12px;align-items:center"><div role="group" aria-label="Filtro" style="display:flex;gap:8px"><sc-for list="{{filters}}" as="f" hint-placeholder-count="3"><button type="button" class="chip" aria-pressed="{{f.on}}" onClick="{{f.pick}}">{{f.l}}</button></sc-for></div></div></div>
<section style="border-top:1px solid #232326;padding:30px 0 40px"><div class="lab" style="margin-bottom:18px">Fotos y videos · {{photoCount}}</div><div style="display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px"><sc-for list="{{photos}}" as="p" hint-placeholder-count="8"><a href="PuntoRetoDia.dc.html" style="background:repeating-linear-gradient(135deg,#1B1B1E 0 10px,#151517 10px 20px);border:1px solid #2A2A2E;border-radius:14px;display:flex;align-items:flex-end;padding:10px 12px;height:200px;position:relative"><span class="mono" style="font-size:11px;color:#8A8A90">{{p.d}} · {{p.c}}</span><span style="position:absolute;right:12px;top:12px;color:#8A8A90;display:{{p.vid}}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 4l13 8-13 8z"/></svg></span></a></sc-for></div></section>
<section style="border-top:1px solid #232326;padding-top:30px"><div class="lab" style="margin-bottom:8px">Diario · {{entryCount}} entradas</div>
<sc-for list="{{entries}}" as="e" hint-placeholder-count="5"><a href="PuntoRetoDia.dc.html" class="row" style="grid-template-columns:90px 140px minmax(0,1fr) auto;padding:24px 0;align-items:start"><span class="mono" style="font-size:28px;letter-spacing:-.04em;line-height:1">D{{e.d}}</span><span class="mono" style="color:#8A8A90;font-size:13px;line-height:1.5">{{e.t}}<br>{{e.m}} min</span><span style="font-size:17px;color:#D2D2D6;line-height:1.55">{{e.x}}</span><span style="display:flex;gap:6px"><sc-for list="{{e.th}}" as="t" hint-placeholder-count="2"><i style="width:56px;height:44px;border-radius:8px;border:1px solid #2A2A2E;background:repeating-linear-gradient(135deg,#1B1B1E 0 6px,#151517 6px 12px)"></i></sc-for></span></a></sc-for></section></main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1360,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const f = (this.state || {}).f ?? 0;
    const E = [[12, 'Hoy', 0, 'Pendiente de escribir. Toca para abrir el diario de hoy.', 0], [11, 'Mar 13 oct', 35, 'Cambio de Sol a Do sin mirar el mástil. Sale limpio a 60 bpm; mañana subo a 70.', 2], [10, 'Lun 12 oct', 30, 'La pentatónica en posición 2 se traba en el tercer traste. Repetir lento.', 1], [9, 'Dom 11 oct', 40, 'Rasgueo con metrónomo. Falta regularidad en el contratiempo.', 1], [8, 'Sáb 10 oct', 45, 'Aprendí el acorde de Mi menor con séptima. Suena mucho mejor de lo que esperaba.', 3], [6, 'Jue 8 oct', 30, 'Afiné de oído por primera vez. Me equivoqué por un semitono, pero ya distingo.', 0]];
    const list = E.filter(e => f === 0 || (f === 1 && e[4] > 0) || (f === 2 && e[3].length > 0 && e[0] !== 12));
    const P = [['D11', 'foto', 0], ['D10', 'foto', 0], ['D8', 'video', 1], ['D8', 'foto', 0], ['D8', 'foto', 0], ['D6', 'foto', 0], ['D4', 'video', 1], ['D2', 'foto', 0]];
    return {
      filters: ['Todo', 'Con fotos', 'Con notas'].map((l, i) => ({ l, on: f === i, pick: () => this.setState({ f: i }) })), photoCount: P.length, photos: P.map(([d, c, v]) => ({ d, c, vid: v ? 'block' : 'none' })),
      entryCount: list.length, entries: list.map(([d, t, m, x, n]) => ({ d, t, m, x, th: Array.from({ length: n }, () => ({})) }))
    };
  }
}
</script>
</body>
</html>
