<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Punto — Habilidad</title>
<script src="./dc-runtime.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&amp;family=Geist+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font-family:inherit;color:inherit}
button{cursor:pointer}
*{box-sizing:border-box}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.mono{font-family:'Geist Mono',ui-monospace,monospace;letter-spacing:.04em}
.lab{font-family:'Geist Mono',ui-monospace,monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#8A8A90}
.dot{aspect-ratio:1/1;border-radius:50%;transition:background .2s}
.tab{font-family:'Geist Mono',monospace;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:#8A8A90;padding:24px 0;position:relative;transition:color .15s}
.tab:hover{color:#F4F4F1}
.tab[aria-current="page"]{color:#F4F4F1}
.tab[aria-current="page"]::before{content:'';position:absolute;left:-14px;top:50%;width:6px;height:6px;margin-top:-3px;border-radius:50%;background:#FF4A1C}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:12px;height:52px;padding:0 26px;border-radius:999px;border:1px solid #3A3A3F;background:transparent;color:#F4F4F1;font-family:'Geist Mono',monospace;font-size:12px;letter-spacing:.12em;text-transform:uppercase;transition:background .15s,border-color .15s,transform .15s;white-space:nowrap}
.btn:hover{background:#17171A;border-color:#55555B}
.btn.sig{background:#FF4A1C;border-color:#FF4A1C;color:#0A0A0B;font-weight:500}
.btn.sig:hover{background:#FF6038;transform:translateY(-1px)}
.btn.sm{height:40px;padding:0 18px;font-size:11px}
.btn.danger{border-color:#7A2A18;color:#FF6A47}
.btn.danger:hover{background:#1A0E0B;border-color:#FF4A1C}
.opt{font-family:'Geist Mono',monospace;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:#6E6E74;background:none;border:0;padding:0;transition:color .15s;display:inline-flex;gap:8px;align-items:center}
.opt:hover{color:#F4F4F1}
.opt[aria-pressed="true"]{color:#F4F4F1}
.opt[aria-pressed="true"]::before{content:'';width:6px;height:6px;border-radius:50%;background:#FF4A1C}
.chip{font-family:'Geist Mono',monospace;font-size:12px;letter-spacing:.1em;text-transform:uppercase;border:1px solid #3A3A3F;border-radius:999px;padding:9px 18px;background:transparent;color:#8A8A90;transition:all .15s}
.chip:hover{border-color:#6E6E74;color:#F4F4F1}
.chip[aria-pressed="true"]{background:#F4F4F1;border-color:#F4F4F1;color:#0A0A0B}
.inp{width:100%;background:transparent;border:0;border-bottom:1px solid #3A3A3F;color:#F4F4F1;font-size:18px;padding:8px 0 12px;font-family:inherit;transition:border-color .15s;border-radius:0}
.inp::placeholder{color:#55555B}
.inp:focus{outline:none;border-bottom-color:#FF4A1C}
textarea.inp{border:1px solid #2E2E33;border-radius:14px;padding:14px 16px;min-height:130px;resize:vertical;line-height:1.55;font-size:16px}
textarea.inp:focus{border-color:#FF4A1C}
.tg{width:48px;height:28px;border-radius:999px;border:1px solid #3A3A3F;background:transparent;position:relative;transition:border-color .2s;flex:none}
.tg::after{content:'';position:absolute;top:5px;left:5px;width:16px;height:16px;border-radius:50%;background:#6E6E74;transition:transform .2s,background .2s}
.tg[aria-pressed="true"]{border-color:#FF4A1C}
.tg[aria-pressed="true"]::after{transform:translateX(20px);background:#FF4A1C}
.sq{width:44px;height:44px;border-radius:50%;border:1px solid #3A3A3F;background:transparent;color:#F4F4F1;font-size:20px;line-height:1;transition:background .15s,border-color .15s;flex:none}
.sq:hover{background:#17171A;border-color:#55555B}
.row{display:grid;align-items:center;gap:24px;padding:20px 0;border-top:1px solid #232326}
.box{border:1px solid #232326;border-radius:22px;padding:28px}
.link{color:#8A8A90;border-bottom:1px solid #3A3A3F;transition:color .15s}
.link:hover{color:#F4F4F1}
.dd{display:flex;gap:6px}
.dd button{width:34px;height:34px;border-radius:50%;border:1px solid #3A3A3F;background:transparent;color:#6E6E74;font-family:'Geist Mono',monospace;font-size:11px;transition:all .15s}
.dd button[aria-pressed="true"]{background:#F4F4F1;border-color:#F4F4F1;color:#0A0A0B}
.kp>div:first-child{border-left:0!important;padding-left:0!important}
a:focus-visible,button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid #FF4A1C;outline-offset:3px}
@keyframes blink{50%{opacity:.15}}
@keyframes breathe{0%,100%{transform:scale(.62);opacity:.7}50%{transform:scale(1);opacity:1}}
@keyframes pop{from{opacity:0;transform:translateY(8px)}}
.pop{animation:pop .4s ease both}

</style>
</helmet>
<div style="min-height:900px;background:#0A0A0B;color:#F4F4F1;font-family:'Geist',system-ui,sans-serif;font-size:15px;line-height:1.5">
<header style="display:flex;align-items:center;padding:0 40px;height:68px;border-bottom:1px solid #232326"><a href="PuntoPanel.dc.html" style="flex:1;font-weight:600;font-size:20px;letter-spacing:-.02em;display:flex;align-items:center;gap:3px">oficio<i style="width:7px;height:7px;border-radius:50%;background:#FF4A1C;margin-top:9px"></i></a><nav aria-label="Principal" style="display:flex;gap:32px;padding-left:14px"><a class="tab" href="PuntoPanel.dc.html" aria-current="page">Hoy</a><a class="tab" href="PuntoTimer.dc.html" >Práctica</a><a class="tab" href="PuntoStats.dc.html" >Datos</a><a class="tab" href="PuntoRetos.dc.html" >Retos</a><a class="tab" href="PuntoLogros.dc.html" >Logros</a><a class="tab" href="PuntoTienda.dc.html" >Tienda</a></nav><div style="flex:1;display:flex;justify-content:flex-end;align-items:center;gap:16px"><span class="lab">Mié 14.10.2026</span><a href="PuntoAvisos.dc.html" aria-label="Avisos" style="color:#8A8A90;position:relative;display:flex"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 16V11a6 6 0 0112 0v5l2 2H4zM10 21h4"/></svg><i style="position:absolute;right:-1px;top:-1px;width:6px;height:6px;border-radius:50%;background:#FF4A1C"></i></a><a href="PuntoAjustes.dc.html" aria-label="Ajustes" style="width:34px;height:34px;border-radius:50%;border:1px solid #3A3A3F;display:flex;align-items:center;justify-content:center;font-family:'Geist Mono',monospace;font-size:12px">K</a></div></header><main style="padding:0 40px 64px"><div style="padding:44px 0 34px;display:flex;align-items:flex-end;gap:32px;flex-wrap:wrap"><div style="flex:1;min-width:320px"><a href="PuntoPanel.dc.html" class="lab link" style="display:inline-block;margin-bottom:18px;border:0">← Hoy</a><br><div class="lab" style="margin-bottom:14px">Habilidad 01</div><h1 style="margin:0;font-size:76px;font-weight:300;letter-spacing:-.05em;line-height:.95">Programación</h1></div><div style="display:flex;gap:12px;align-items:center"><a href="PuntoRegistro.dc.html" class="btn">Registrar horas</a><a href="PuntoTimer.dc.html" class="btn sig"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 4l13 8-13 8z"/></svg>Empezar</a></div></div>
<section style="display:grid;grid-template-columns:minmax(0,7fr) minmax(0,5fr);border-top:1px solid #232326"><div style="padding:36px 56px 36px 0;border-right:1px solid #232326"><div style="display:flex;align-items:baseline;gap:18px"><span style="font-size:150px;font-weight:300;letter-spacing:-.07em;line-height:.9">1.284</span><span class="mono" style="color:#8A8A90">/ 10.000 H</span></div>
<div style="display:flex;gap:3px;align-items:flex-end;height:64px;margin-top:34px" role="img" aria-label="12,8 % de 10.000 horas"><sc-for list="{{ticks}}" as="t" hint-placeholder-count="100"><i style="flex:1;height:{{t.h}}px;background:{{t.bg}};border-radius:1px"></i></sc-for></div>
<div class="lab" style="display:flex;justify-content:space-between;margin-top:10px;font-size:10px"><span>0</span><span>2.500</span><span>5.000</span><span>7.500</span><span>10.000</span></div></div>
<div style="padding:36px 0 36px 56px;display:flex;flex-direction:column;justify-content:center"><sc-for list="{{facts}}" as="f" hint-placeholder-count="4"><div class="row" style="grid-template-columns:1fr auto;padding:16px 0"><span class="lab">{{f.l}}</span><span class="mono" style="font-size:17px;text-align:right">{{f.v}}</span></div></sc-for></div></section>

<section style="border-top:1px solid #232326;padding:30px 0 36px"><div style="display:flex;margin-bottom:22px"><span class="lab" style="flex:1">Actividad · 40 semanas</span><span class="lab" style="color:#F4F4F1">Programación</span></div>
<div role="img" aria-label="Mapa de actividad" style="display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,auto);grid-template-columns:repeat(40,1fr);gap:5px"><sc-for list="{{cells}}" as="c" hint-placeholder-count="280"><i class="dot" title="{{c.t}}" style="background:{{c.bg}}"></i></sc-for></div></section>

<section style="display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);border-top:1px solid #232326"><div style="padding:30px 56px 0 0;border-right:1px solid #232326"><div class="lab" style="margin-bottom:8px">Hitos</div>
<sc-for list="{{miles}}" as="m" hint-placeholder-count="5"><div class="row" style="grid-template-columns:28px 1fr auto;padding:16px 0"><i class="dot" style="width:14px;background:{{m.bg}};box-shadow:{{m.sh}}"></i><div><div style="font-size:18px;color:{{m.c}}">{{m.n}}</div><div class="mono" style="font-size:12px;color:#8A8A90">{{m.d}}</div></div><span class="mono" style="font-size:13px;color:{{m.c}}">{{m.v}}</span></div></sc-for></div>
<div style="padding:30px 0 0 56px"><div class="lab" style="margin-bottom:8px">Sesiones recientes</div>
<sc-for list="{{log}}" as="x" hint-placeholder-count="5"><div class="row" style="grid-template-columns:110px 70px 1fr 90px;padding:15px 0"><span class="mono" style="color:#8A8A90;font-size:13px">{{x.d}}</span><span class="mono" style="font-size:14px">{{x.t}}</span><span style="color:#B9B9BD;font-size:15px">{{x.n}}</span><span style="display:flex;gap:5px;justify-content:flex-end"><sc-for list="{{x.q}}" as="q" hint-placeholder-count="5"><i class="dot" style="width:8px;background:{{q.bg}}"></i></sc-for></span></div></sc-for></div></section></main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1360,"height":900}}'>
class Component extends DCLogic {
  heat(f, cols) {
    cols = cols || 53; const mult = [1, 0.95, 0.65, 0.4][f]; const out = []; const today = (cols - 1) * 7 + 3;
    const lv = ['#1B1B1E', 'rgba(244,244,241,.22)', 'rgba(244,244,241,.45)', 'rgba(244,244,241,.72)', '#F4F4F1'];
    for (let w = 0; w < cols; w++) for (let d = 0; d < 7; d++) {
      const i = w * 7 + d; const g = i + 600;
      if (i > today) { out.push({ bg: 'transparent', t: '' }); continue; }
      const r = ((g * 73 + f * 29 + 7) % 101) / 100; const p = (0.3 + 0.55 * (w / cols)) * mult;
      let l = r > p ? 0 : 1 + Math.min(3, Math.floor(((g * 31 + f * 7) % 10) / 2.6));
      if (i > today - 12 && f < 2) l = Math.max(l, 2 + (i % 3 === 0 ? 1 : 0));
      out.push({ bg: i === today ? '#FF4A1C' : lv[l], t: l ? (l * 25 + (g % 4) * 10) + ' min' : 'Sin práctica' });
    }
    return out;
  }
  renderVals() {
    const cells = this.heat(1, 40);
    return {
      ticks: Array.from({ length: 100 }, (_, t) => ({ h: (t + 1) % 10 === 0 ? 64 : 40, bg: t + 1 <= 12 ? '#F4F4F1' : (t < 12.84 ? 'rgba(244,244,241,.5)' : '#232326') })),
      facts: [['Racha', '12 días'], ['Ritmo últimos 30 d', '1:37 / día'], ['Proyección a 10.000 h', '8,1 años'], ['Fecha estimada', 'nov 2034']].map(([l, v]) => ({ l, v })),
      cells,
      miles: [['100 horas', 'Primeros pasos', 'logrado', 1], ['500 horas', 'Constancia', 'logrado', 1], ['1.000 horas', 'Competente', 'logrado', 1], ['2.500 horas', 'Faltan 1.216 h', 'siguiente', 2], ['5.000 horas', 'Avanzado', 'pendiente', 0], ['10.000 horas', 'Maestría', 'pendiente', 0]].map(([n, d, v, s]) => ({ n, d, v, c: s === 0 ? '#6E6E74' : '#F4F4F1', bg: s === 1 ? '#F4F4F1' : s === 2 ? '#FF4A1C' : '#232326', sh: s === 2 ? '0 0 0 4px rgba(255,74,28,.25)' : 'none' })),
      log: [['Hoy', '21:30', 'Promises y async/await', 4], ['Hoy', '08:40', 'Ejercicios de closures', 5], ['Hoy', '08:10', 'Event loop', 4], ['Ayer', '20:15', 'API REST con Express', 3], ['Ayer', '07:40', 'Repaso de arrays', 4]].map(([d, t, n, q]) => ({ d, t, n, q: [1, 2, 3, 4, 5].map(i => ({ bg: i <= q ? '#F4F4F1' : '#232326' })) }))
    };
  }
}
</script>
</body>
</html>
