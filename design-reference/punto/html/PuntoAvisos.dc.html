<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Punto — Avisos</title>
<script src="./dc-runtime.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&amp;family=Geist+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font-family:inherit;color:inherit}
button{cursor:pointer}
*{box-sizing:border-box}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.mono{font-family:'Geist Mono',ui-monospace,monospace;letter-spacing:.04em}
.lab{font-family:'Geist Mono',ui-monospace,monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#8A8A90}
.dot{aspect-ratio:1/1;border-radius:50%;transition:background .2s}
.tab{font-family:'Geist Mono',monospace;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:#8A8A90;padding:24px 0;position:relative;transition:color .15s}
.tab:hover{color:#F4F4F1}
.tab[aria-current="page"]{color:#F4F4F1}
.tab[aria-current="page"]::before{content:'';position:absolute;left:-14px;top:50%;width:6px;height:6px;margin-top:-3px;border-radius:50%;background:#FF4A1C}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:12px;height:52px;padding:0 26px;border-radius:999px;border:1px solid #3A3A3F;background:transparent;color:#F4F4F1;font-family:'Geist Mono',monospace;font-size:12px;letter-spacing:.12em;text-transform:uppercase;transition:background .15s,border-color .15s,transform .15s;white-space:nowrap}
.btn:hover{background:#17171A;border-color:#55555B}
.btn.sig{background:#FF4A1C;border-color:#FF4A1C;color:#0A0A0B;font-weight:500}
.btn.sig:hover{background:#FF6038;transform:translateY(-1px)}
.btn.sm{height:40px;padding:0 18px;font-size:11px}
.btn.danger{border-color:#7A2A18;color:#FF6A47}
.btn.danger:hover{background:#1A0E0B;border-color:#FF4A1C}
.opt{font-family:'Geist Mono',monospace;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:#6E6E74;background:none;border:0;padding:0;transition:color .15s;display:inline-flex;gap:8px;align-items:center}
.opt:hover{color:#F4F4F1}
.opt[aria-pressed="true"]{color:#F4F4F1}
.opt[aria-pressed="true"]::before{content:'';width:6px;height:6px;border-radius:50%;background:#FF4A1C}
.chip{font-family:'Geist Mono',monospace;font-size:12px;letter-spacing:.1em;text-transform:uppercase;border:1px solid #3A3A3F;border-radius:999px;padding:9px 18px;background:transparent;color:#8A8A90;transition:all .15s}
.chip:hover{border-color:#6E6E74;color:#F4F4F1}
.chip[aria-pressed="true"]{background:#F4F4F1;border-color:#F4F4F1;color:#0A0A0B}
.inp{width:100%;background:transparent;border:0;border-bottom:1px solid #3A3A3F;color:#F4F4F1;font-size:18px;padding:8px 0 12px;font-family:inherit;transition:border-color .15s;border-radius:0}
.inp::placeholder{color:#55555B}
.inp:focus{outline:none;border-bottom-color:#FF4A1C}
textarea.inp{border:1px solid #2E2E33;border-radius:14px;padding:14px 16px;min-height:130px;resize:vertical;line-height:1.55;font-size:16px}
textarea.inp:focus{border-color:#FF4A1C}
.tg{width:48px;height:28px;border-radius:999px;border:1px solid #3A3A3F;background:transparent;position:relative;transition:border-color .2s;flex:none}
.tg::after{content:'';position:absolute;top:5px;left:5px;width:16px;height:16px;border-radius:50%;background:#6E6E74;transition:transform .2s,background .2s}
.tg[aria-pressed="true"]{border-color:#FF4A1C}
.tg[aria-pressed="true"]::after{transform:translateX(20px);background:#FF4A1C}
.sq{width:44px;height:44px;border-radius:50%;border:1px solid #3A3A3F;background:transparent;color:#F4F4F1;font-size:20px;line-height:1;transition:background .15s,border-color .15s;flex:none}
.sq:hover{background:#17171A;border-color:#55555B}
.row{display:grid;align-items:center;gap:24px;padding:20px 0;border-top:1px solid #232326}
.box{border:1px solid #232326;border-radius:22px;padding:28px}
.link{color:#8A8A90;border-bottom:1px solid #3A3A3F;transition:color .15s}
.link:hover{color:#F4F4F1}
.dd{display:flex;gap:6px}
.dd button{width:34px;height:34px;border-radius:50%;border:1px solid #3A3A3F;background:transparent;color:#6E6E74;font-family:'Geist Mono',monospace;font-size:11px;transition:all .15s}
.dd button[aria-pressed="true"]{background:#F4F4F1;border-color:#F4F4F1;color:#0A0A0B}
.kp>div:first-child{border-left:0!important;padding-left:0!important}
a:focus-visible,button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid #FF4A1C;outline-offset:3px}
@keyframes blink{50%{opacity:.15}}
@keyframes breathe{0%,100%{transform:scale(.62);opacity:.7}50%{transform:scale(1);opacity:1}}
@keyframes pop{from{opacity:0;transform:translateY(8px)}}
.pop{animation:pop .4s ease both}

</style>
</helmet>
<div style="min-height:900px;background:#0A0A0B;color:#F4F4F1;font-family:'Geist',system-ui,sans-serif;font-size:15px;line-height:1.5">
<header style="display:flex;align-items:center;padding:0 40px;height:68px;border-bottom:1px solid #232326"><a href="PuntoPanel.dc.html" style="flex:1;font-weight:600;font-size:20px;letter-spacing:-.02em;display:flex;align-items:center;gap:3px">oficio<i style="width:7px;height:7px;border-radius:50%;background:#FF4A1C;margin-top:9px"></i></a><nav aria-label="Principal" style="display:flex;gap:32px;padding-left:14px"><a class="tab" href="PuntoPanel.dc.html" >Hoy</a><a class="tab" href="PuntoTimer.dc.html" >Práctica</a><a class="tab" href="PuntoStats.dc.html" >Datos</a><a class="tab" href="PuntoRetos.dc.html" >Retos</a><a class="tab" href="PuntoLogros.dc.html" >Logros</a><a class="tab" href="PuntoTienda.dc.html" >Tienda</a></nav><div style="flex:1;display:flex;justify-content:flex-end;align-items:center;gap:16px"><span class="lab">Mié 14.10.2026</span><a href="PuntoAvisos.dc.html" aria-label="Avisos" style="color:#8A8A90;position:relative;display:flex"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 16V11a6 6 0 0112 0v5l2 2H4zM10 21h4"/></svg><i style="position:absolute;right:-1px;top:-1px;width:6px;height:6px;border-radius:50%;background:#FF4A1C"></i></a><a href="PuntoAjustes.dc.html" aria-label="Ajustes" style="width:34px;height:34px;border-radius:50%;border:1px solid #3A3A3F;display:flex;align-items:center;justify-content:center;font-family:'Geist Mono',monospace;font-size:12px">K</a></div></header><main style="padding:0 40px 64px"><div style="padding:44px 0 34px;display:flex;align-items:flex-end;gap:32px;flex-wrap:wrap"><div style="flex:1;min-width:320px"><div class="lab" style="margin-bottom:14px">Recordatorios</div><h1 style="margin:0;font-size:76px;font-weight:300;letter-spacing:-.05em;line-height:.95">Avisos</h1></div><div style="display:flex;gap:12px;align-items:center"><span class="lab">{{activeCount}} activos</span></div></div>
<section style="display:grid;grid-template-columns:minmax(0,7fr) minmax(0,5fr)">
<div style="padding-right:56px;border-right:1px solid #232326"><div class="lab" style="margin-bottom:8px">Tus avisos</div>
<sc-for list="{{items}}" as="a" hint-placeholder-count="3"><div class="row" style="grid-template-columns:130px minmax(0,1fr) auto 60px;padding:26px 0;opacity:{{a.op}};transition:opacity .2s"><span class="mono" style="font-size:36px;letter-spacing:-.03em">{{a.time}}</span><div><div style="font-size:20px;font-weight:500">{{a.skill}}</div><div style="color:#8A8A90;font-size:14px">{{a.msg}}</div></div>
<div class="dd" role="group" aria-label="Días"><sc-for list="{{a.days}}" as="d" hint-placeholder-count="7"><button type="button" aria-pressed="{{d.on}}" onClick="{{d.tog}}">{{d.l}}</button></sc-for></div><button type="button" class="tg" aria-label="Activar aviso" aria-pressed="{{a.on}}" onClick="{{a.toggle}}"></button></div></sc-for>
<div style="margin-top:44px"><div class="lab" style="margin-bottom:8px">Avisos del sistema</div><sc-for list="{{system}}" as="s" hint-placeholder-count="3"><div class="row" style="grid-template-columns:1fr 60px"><div><div style="font-size:18px">{{s.n}}</div><div style="color:#8A8A90;font-size:14px">{{s.d}}</div></div><button type="button" class="tg" aria-label="{{s.n}}" aria-pressed="{{s.on}}" onClick="{{s.toggle}}"></button></div></sc-for></div></div>
<div style="padding-left:56px"><div class="lab" style="margin-bottom:26px">Nuevo aviso</div>
<label class="fld" style="display:block;margin-bottom:28px"><span class="lab" style="display:block;margin-bottom:6px">Hora</span><input class="inp mono" value="{{nt}}" onChange="{{typeT}}" style="font-size:40px;letter-spacing:-.02em"></label>
<div style="margin-bottom:28px"><span class="lab" style="display:block;margin-bottom:12px">Habilidad</span><div style="display:flex;gap:8px;flex-wrap:wrap"><sc-for list="{{skills}}" as="k" hint-placeholder-count="3"><button type="button" class="chip" aria-pressed="{{k.on}}" onClick="{{k.pick}}">{{k.n}}</button></sc-for></div></div>
<div style="margin-bottom:28px"><span class="lab" style="display:block;margin-bottom:12px">Días</span><div class="dd"><sc-for list="{{nd}}" as="d" hint-placeholder-count="7"><button type="button" aria-pressed="{{d.on}}" onClick="{{d.tog}}">{{d.l}}</button></sc-for></div></div>
<label class="fld" style="display:block;margin-bottom:34px"><span class="lab" style="display:block;margin-bottom:6px">Mensaje</span><input class="inp" placeholder="Hora de practicar" value="{{nm}}" onChange="{{typeM}}"></label>
<button type="button" class="btn sig" onClick="{{create}}">Crear aviso</button></div></section></main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1360,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const st = this.state || {}; const D = ['L', 'M', 'X', 'J', 'V', 'S', 'D']; const names = ['Programación', 'Inglés', 'Guitarra'];
    const items = st.items || [{ time: '19:00', skill: 'Guitarra', msg: 'Escalas y una nota del reto', days: [1, 1, 1, 1, 1, 0, 0], on: true }, { time: '07:30', skill: 'Programación', msg: 'Primer bloque de enfoque', days: [1, 1, 1, 1, 1, 0, 0], on: true }, { time: '13:00', skill: 'Inglés', msg: '15 minutos de escucha', days: [1, 0, 1, 0, 1, 0, 0], on: false }];
    const sys = st.sys || [{ n: 'Racha en riesgo', d: 'Aviso a las 21:00 si aún no practicas hoy', on: true }, { n: 'Resumen semanal', d: 'Domingo 18:00 con tus horas y logros', on: true }, { n: 'Notificaciones del navegador', d: 'Permite avisos aunque la pestaña esté cerrada', on: false }];
    const nd = st.nd || [1, 1, 1, 1, 1, 0, 0]; const ns = st.ns ?? 0;
    const set = (o) => this.setState(o);
    return {
      activeCount: items.filter(i => i.on).length + sys.filter(s => s.on).length,
      items: items.map((a, i) => ({ ...a, op: a.on ? 1 : 0.4, toggle: () => set({ items: items.map((x, j) => j === i ? { ...x, on: !x.on } : x) }), days: D.map((l, d) => ({ l, on: !!a.days[d], tog: () => set({ items: items.map((x, j) => j === i ? { ...x, days: x.days.map((v, k) => k === d ? (v ? 0 : 1) : v) } : x) }) })) })),
      system: sys.map((s, i) => ({ ...s, toggle: () => set({ sys: sys.map((x, j) => j === i ? { ...x, on: !x.on } : x) }) })),
      nt: st.nt ?? '20:00', typeT: (e) => set({ nt: e.target.value }), nm: st.nm ?? '', typeM: (e) => set({ nm: e.target.value }),
      skills: names.map((n, i) => ({ n, on: ns === i, pick: () => set({ ns: i }) })), nd: D.map((l, d) => ({ l, on: !!nd[d], tog: () => set({ nd: nd.map((v, k) => k === d ? (v ? 0 : 1) : v) }) })),
      create: () => set({ items: [{ time: st.nt || '20:00', skill: names[ns], msg: st.nm || 'Hora de practicar', days: nd, on: true }, ...items], nm: '' })
    };
  }
}
</script>
</body>
</html>
