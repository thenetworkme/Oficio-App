<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Punto — Datos</title>
<script src="./dc-runtime.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&amp;family=Geist+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font-family:inherit;color:inherit}
button{cursor:pointer}
*{box-sizing:border-box}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.mono{font-family:'Geist Mono',ui-monospace,monospace;letter-spacing:.04em}
.lab{font-family:'Geist Mono',ui-monospace,monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#8A8A90}
.dot{aspect-ratio:1/1;border-radius:50%;transition:background .2s}
.tab{font-family:'Geist Mono',monospace;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:#8A8A90;padding:24px 0;position:relative;transition:color .15s}
.tab:hover{color:#F4F4F1}
.tab[aria-current="page"]{color:#F4F4F1}
.tab[aria-current="page"]::before{content:'';position:absolute;left:-14px;top:50%;width:6px;height:6px;margin-top:-3px;border-radius:50%;background:#FF4A1C}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:12px;height:52px;padding:0 26px;border-radius:999px;border:1px solid #3A3A3F;background:transparent;color:#F4F4F1;font-family:'Geist Mono',monospace;font-size:12px;letter-spacing:.12em;text-transform:uppercase;transition:background .15s,border-color .15s,transform .15s;white-space:nowrap}
.btn:hover{background:#17171A;border-color:#55555B}
.btn.sig{background:#FF4A1C;border-color:#FF4A1C;color:#0A0A0B;font-weight:500}
.btn.sig:hover{background:#FF6038;transform:translateY(-1px)}
.btn.sm{height:40px;padding:0 18px;font-size:11px}
.btn.danger{border-color:#7A2A18;color:#FF6A47}
.btn.danger:hover{background:#1A0E0B;border-color:#FF4A1C}
.opt{font-family:'Geist Mono',monospace;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:#6E6E74;background:none;border:0;padding:0;transition:color .15s;display:inline-flex;gap:8px;align-items:center}
.opt:hover{color:#F4F4F1}
.opt[aria-pressed="true"]{color:#F4F4F1}
.opt[aria-pressed="true"]::before{content:'';width:6px;height:6px;border-radius:50%;background:#FF4A1C}
.chip{font-family:'Geist Mono',monospace;font-size:12px;letter-spacing:.1em;text-transform:uppercase;border:1px solid #3A3A3F;border-radius:999px;padding:9px 18px;background:transparent;color:#8A8A90;transition:all .15s}
.chip:hover{border-color:#6E6E74;color:#F4F4F1}
.chip[aria-pressed="true"]{background:#F4F4F1;border-color:#F4F4F1;color:#0A0A0B}
.inp{width:100%;background:transparent;border:0;border-bottom:1px solid #3A3A3F;color:#F4F4F1;font-size:18px;padding:8px 0 12px;font-family:inherit;transition:border-color .15s;border-radius:0}
.inp::placeholder{color:#55555B}
.inp:focus{outline:none;border-bottom-color:#FF4A1C}
textarea.inp{border:1px solid #2E2E33;border-radius:14px;padding:14px 16px;min-height:130px;resize:vertical;line-height:1.55;font-size:16px}
textarea.inp:focus{border-color:#FF4A1C}
.tg{width:48px;height:28px;border-radius:999px;border:1px solid #3A3A3F;background:transparent;position:relative;transition:border-color .2s;flex:none}
.tg::after{content:'';position:absolute;top:5px;left:5px;width:16px;height:16px;border-radius:50%;background:#6E6E74;transition:transform .2s,background .2s}
.tg[aria-pressed="true"]{border-color:#FF4A1C}
.tg[aria-pressed="true"]::after{transform:translateX(20px);background:#FF4A1C}
.sq{width:44px;height:44px;border-radius:50%;border:1px solid #3A3A3F;background:transparent;color:#F4F4F1;font-size:20px;line-height:1;transition:background .15s,border-color .15s;flex:none}
.sq:hover{background:#17171A;border-color:#55555B}
.row{display:grid;align-items:center;gap:24px;padding:20px 0;border-top:1px solid #232326}
.box{border:1px solid #232326;border-radius:22px;padding:28px}
.link{color:#8A8A90;border-bottom:1px solid #3A3A3F;transition:color .15s}
.link:hover{color:#F4F4F1}
.dd{display:flex;gap:6px}
.dd button{width:34px;height:34px;border-radius:50%;border:1px solid #3A3A3F;background:transparent;color:#6E6E74;font-family:'Geist Mono',monospace;font-size:11px;transition:all .15s}
.dd button[aria-pressed="true"]{background:#F4F4F1;border-color:#F4F4F1;color:#0A0A0B}
.kp>div:first-child{border-left:0!important;padding-left:0!important}
a:focus-visible,button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid #FF4A1C;outline-offset:3px}
@keyframes blink{50%{opacity:.15}}
@keyframes breathe{0%,100%{transform:scale(.62);opacity:.7}50%{transform:scale(1);opacity:1}}
@keyframes pop{from{opacity:0;transform:translateY(8px)}}
.pop{animation:pop .4s ease both}

</style>
</helmet>
<div style="min-height:900px;background:#0A0A0B;color:#F4F4F1;font-family:'Geist',system-ui,sans-serif;font-size:15px;line-height:1.5">
<header style="display:flex;align-items:center;padding:0 40px;height:68px;border-bottom:1px solid #232326"><a href="PuntoPanel.dc.html" style="flex:1;font-weight:600;font-size:20px;letter-spacing:-.02em;display:flex;align-items:center;gap:3px">oficio<i style="width:7px;height:7px;border-radius:50%;background:#FF4A1C;margin-top:9px"></i></a><nav aria-label="Principal" style="display:flex;gap:32px;padding-left:14px"><a class="tab" href="PuntoPanel.dc.html" >Hoy</a><a class="tab" href="PuntoTimer.dc.html" >Práctica</a><a class="tab" href="PuntoStats.dc.html" aria-current="page">Datos</a><a class="tab" href="PuntoRetos.dc.html" >Retos</a><a class="tab" href="PuntoLogros.dc.html" >Logros</a><a class="tab" href="PuntoTienda.dc.html" >Tienda</a></nav><div style="flex:1;display:flex;justify-content:flex-end;align-items:center;gap:16px"><span class="lab">Mié 14.10.2026</span><a href="PuntoAvisos.dc.html" aria-label="Avisos" style="color:#8A8A90;position:relative;display:flex"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 16V11a6 6 0 0112 0v5l2 2H4zM10 21h4"/></svg><i style="position:absolute;right:-1px;top:-1px;width:6px;height:6px;border-radius:50%;background:#FF4A1C"></i></a><a href="PuntoAjustes.dc.html" aria-label="Ajustes" style="width:34px;height:34px;border-radius:50%;border:1px solid #3A3A3F;display:flex;align-items:center;justify-content:center;font-family:'Geist Mono',monospace;font-size:12px">K</a></div></header><main style="padding:0 40px 64px"><div style="padding:44px 0 34px;display:flex;align-items:flex-end;gap:32px;flex-wrap:wrap"><div style="flex:1;min-width:320px"><div class="lab" style="margin-bottom:14px">Datos · octubre 2026</div><h1 style="margin:0;font-size:76px;font-weight:300;letter-spacing:-.05em;line-height:.95">Tus números</h1></div><div style="display:flex;gap:12px;align-items:center"><div role="group" aria-label="Periodo" style="display:flex;gap:8px"><sc-for list="{{ranges}}" as="r" hint-placeholder-count="3"><button type="button" class="chip" aria-pressed="{{r.on}}" onClick="{{r.pick}}">{{r.l}}</button></sc-for></div></div></div>
<section class="kp" style="display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-top:1px solid #232326;border-bottom:1px solid #232326"><sc-for list="{{kpis}}" as="k" hint-placeholder-count="4"><div style="padding:28px 28px 28px;border-left:1px solid #232326"><div class="lab">{{k.l}}</div><div style="font-size:60px;font-weight:300;letter-spacing:-.05em;line-height:1.05;margin:10px 0 6px">{{k.v}}</div><div class="mono" style="font-size:12px;color:#8A8A90">{{k.s}}</div></div></sc-for></section>

<section style="padding:36px 0 40px;border-bottom:1px solid #232326"><div style="display:flex;align-items:center;margin-bottom:26px"><span class="lab" style="flex:1">{{chartTitle}}</span><span class="lab"><i style="display:inline-block;width:8px;height:8px;border-radius:50%;background:#F4F4F1;margin-right:8px"></i>{{unit}}</span></div>
<div role="img" aria-label="Gráfica de horas" style="{{gridStyle}}"><sc-for list="{{bars}}" as="b" hint-placeholder-count="240"><i style="{{b.st}}"></i></sc-for></div>
<div style="{{labStyle}};margin-top:14px"><sc-for list="{{labels}}" as="l" hint-placeholder-count="30"><span class="lab" style="font-size:10px;text-align:center;color:{{l.c}}">{{l.t}}</span></sc-for></div></section>

<section style="display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr)"><div style="padding:36px 48px 40px 0;border-right:1px solid #232326"><div class="lab" style="margin-bottom:24px">Reparto por habilidad</div>
<div style="display:flex;gap:3px;align-items:flex-end;height:40px" role="img" aria-label="Reparto por habilidad"><sc-for list="{{split}}" as="t" hint-placeholder-count="100"><i style="flex:1;height:{{t.h}}px;background:{{t.bg}};border-radius:1px"></i></sc-for></div>
<div style="margin-top:22px"><sc-for list="{{skills}}" as="s" hint-placeholder-count="3"><div class="row" style="grid-template-columns:20px 1fr auto auto;padding:14px 0"><i style="width:12px;height:12px;border-radius:50%;background:{{s.c}}"></i><span style="font-size:18px">{{s.n}}</span><span class="mono" style="font-size:13px;color:#8A8A90">{{s.h}}</span><span class="mono" style="font-size:13px;width:56px;text-align:right">{{s.p}}</span></div></sc-for></div></div>
<div style="padding:36px 0 40px 48px"><div style="display:flex;margin-bottom:24px"><span class="lab" style="flex:1">A qué hora practicas</span><span class="lab" style="color:#F4F4F1">Pico 08:00</span></div>
<div role="img" aria-label="Distribución por hora" style="display:grid;grid-template-columns:repeat(24,1fr);gap:5px"><sc-for list="{{hours}}" as="h" hint-placeholder-count="144"><i class="dot" style="background:{{h.bg}}"></i></sc-for></div>
<div class="lab" style="display:flex;justify-content:space-between;margin-top:12px;font-size:10px"><span>00</span><span>06</span><span>12</span><span>18</span><span>23</span></div></div></section>

<section style="border-top:1px solid #232326;padding-top:30px"><div class="lab" style="margin-bottom:8px">Récords</div>
<sc-for list="{{records}}" as="r" hint-placeholder-count="4"><div class="row" style="grid-template-columns:260px 1fr auto"><span style="font-size:20px">{{r.l}}</span><span class="mono" style="color:#8A8A90;font-size:13px">{{r.d}}</span><span class="mono" style="font-size:18px">{{r.v}}</span></div></sc-for></section>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1360,"height":900}}'>
class Component extends DCLogic {
  hm(min) { return String(Math.floor(min / 60)).padStart(2, '0') + ':' + String(min % 60).padStart(2, '0'); }
  fm(n) { return n >= 1000 ? Math.floor(n / 1000) + '.' + String(n % 1000).padStart(3, '0') : String(n); }
  renderVals() {
    const r = (this.state || {}).r ?? 0;
    const KP = [[['Total del periodo', '12:15', '+1:20 vs semana anterior'], ['Promedio diario', '1:45', 'meta 2:00'], ['Mejor día', '2:35', 'sábado 10 oct'], ['Sesiones', '21', 'media 35 min']], [['Total del periodo', '48:40', '+4:10 vs mes anterior'], ['Promedio diario', '1:37', 'meta 2:00'], ['Mejor día', '3:20', 'mié 23 sep'], ['Sesiones', '84', 'media 35 min']], [['Total del periodo', '150:10', '+12:30 vs trimestre ant.'], ['Promedio diario', '1:47', 'meta 2:00'], ['Mejor día', '3:20', 'mié 23 sep'], ['Sesiones', '262', 'media 34 min']]][r];
    const N = [7, 30, 12][r];
    const lv = r === 0 ? [3, 4, 4, 3, 4, 2, 4] : r === 1 ? Array.from({ length: 30 }, (_, i) => Math.min(7, Math.max(0, 2 + ((i * 37 + 11) % 5) + (i > 20 ? 1 : 0) - (i % 7 === 6 ? 2 : 0)))) : [5, 5, 6, 6, 5, 6, 7, 6, 6, 7, 6, 6];
    const size = [22, 14, 20][r];
    const bars = []; for (let row = 0; row < 8; row++) for (let c = 0; c < N; c++) { const lit = (8 - row) <= lv[c]; const last = c === N - 1; bars.push({ st: 'width:' + size + 'px;height:' + size + 'px;border-radius:50%;justify-self:center;background:' + (lit ? (last ? '#FF4A1C' : '#F4F4F1') : '#17171A') }); }
    const dn = ['J', 'V', 'S', 'D', 'L', 'M', 'X'];
    const labels = Array.from({ length: N }, (_, i) => ({ t: r === 0 ? dn[i] : r === 1 ? (i % 5 === 0 || i === N - 1 ? String(15 + i > 30 ? 15 + i - 30 : 15 + i) : '') : 'S' + (i + 1), c: i === N - 1 ? '#FF4A1C' : '#8A8A90' }));
    const sp = [58, 29, 13]; const tl = []; sp.forEach((p, k) => { for (let i = 0; i < p; i++) tl.push({ h: [34, 24, 16][k], bg: ['#F4F4F1', 'rgba(244,244,241,.5)', 'rgba(244,244,241,.22)'][k] }); });
    const hv = [0, 0, 0, 0, 0, 1, 3, 5, 6, 4, 2, 1, 1, 4, 3, 2, 1, 1, 2, 3, 2, 4, 3, 1];
    const hours = []; for (let row = 0; row < 6; row++) for (let c = 0; c < 24; c++) hours.push({ bg: (6 - row) <= hv[c] ? (c === 8 ? '#FF4A1C' : '#F4F4F1') : '#17171A' });
    return {
      ranges: ['7 días', '30 días', '12 semanas'].map((l, i) => ({ l, on: r === i, pick: () => this.setState({ r: i }) })),
      kpis: KP.map(([l, v, s]) => ({ l, v, s })), chartTitle: ['Horas por día · últimos 7 días', 'Horas por día · últimos 30 días', 'Horas por semana · últimas 12 semanas'][r], unit: r === 2 ? '= 2 h' : '= 30 min',
      gridStyle: 'display:grid;grid-template-columns:repeat(' + N + ',1fr);row-gap:8px', labStyle: 'display:grid;grid-template-columns:repeat(' + N + ',1fr)', bars, labels, split: tl,
      skills: [['Programación', '28:12', '58 %', '#F4F4F1'], ['Inglés', '14:08', '29 %', 'rgba(244,244,241,.5)'], ['Guitarra', '6:20', '13 %', 'rgba(244,244,241,.22)']].map(([n, h, p, c]) => ({ n, h, p, c })), hours,
      records: [['Racha más larga', 'del 14 ene al 3 feb 2026', '21 días'], ['Sesión más larga', 'Programación · 3 oct', '1:32'], ['Mejor semana', '28 sep al 4 oct', '16:40'], ['Mes más fuerte', 'septiembre 2026', '61:10']].map(([l, d, v]) => ({ l, d, v }))
    };
  }
}
</script>
</body>
</html>
