<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Punto — Temporizador</title>
<script src="./dc-runtime.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&amp;family=Geist+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font-family:inherit;color:inherit}
button{cursor:pointer}
*{box-sizing:border-box}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.mono{font-family:'Geist Mono',ui-monospace,monospace;letter-spacing:.04em}
.lab{font-family:'Geist Mono',ui-monospace,monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#8A8A90}
.dot{aspect-ratio:1/1;border-radius:50%;transition:background .2s}
.tab{font-family:'Geist Mono',monospace;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:#8A8A90;padding:24px 0;position:relative;transition:color .15s}
.tab:hover{color:#F4F4F1}
.tab[aria-current="page"]{color:#F4F4F1}
.tab[aria-current="page"]::before{content:'';position:absolute;left:-14px;top:50%;width:6px;height:6px;margin-top:-3px;border-radius:50%;background:#FF4A1C}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:12px;height:52px;padding:0 26px;border-radius:999px;border:1px solid #3A3A3F;background:transparent;color:#F4F4F1;font-family:'Geist Mono',monospace;font-size:12px;letter-spacing:.12em;text-transform:uppercase;transition:background .15s,border-color .15s,transform .15s;white-space:nowrap}
.btn:hover{background:#17171A;border-color:#55555B}
.btn.sig{background:#FF4A1C;border-color:#FF4A1C;color:#0A0A0B;font-weight:500}
.btn.sig:hover{background:#FF6038;transform:translateY(-1px)}
.btn.sm{height:40px;padding:0 18px;font-size:11px}
.btn.danger{border-color:#7A2A18;color:#FF6A47}
.btn.danger:hover{background:#1A0E0B;border-color:#FF4A1C}
.opt{font-family:'Geist Mono',monospace;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:#6E6E74;background:none;border:0;padding:0;transition:color .15s;display:inline-flex;gap:8px;align-items:center}
.opt:hover{color:#F4F4F1}
.opt[aria-pressed="true"]{color:#F4F4F1}
.opt[aria-pressed="true"]::before{content:'';width:6px;height:6px;border-radius:50%;background:#FF4A1C}
.chip{font-family:'Geist Mono',monospace;font-size:12px;letter-spacing:.1em;text-transform:uppercase;border:1px solid #3A3A3F;border-radius:999px;padding:9px 18px;background:transparent;color:#8A8A90;transition:all .15s}
.chip:hover{border-color:#6E6E74;color:#F4F4F1}
.chip[aria-pressed="true"]{background:#F4F4F1;border-color:#F4F4F1;color:#0A0A0B}
.inp{width:100%;background:transparent;border:0;border-bottom:1px solid #3A3A3F;color:#F4F4F1;font-size:18px;padding:8px 0 12px;font-family:inherit;transition:border-color .15s;border-radius:0}
.inp::placeholder{color:#55555B}
.inp:focus{outline:none;border-bottom-color:#FF4A1C}
textarea.inp{border:1px solid #2E2E33;border-radius:14px;padding:14px 16px;min-height:130px;resize:vertical;line-height:1.55;font-size:16px}
textarea.inp:focus{border-color:#FF4A1C}
.tg{width:48px;height:28px;border-radius:999px;border:1px solid #3A3A3F;background:transparent;position:relative;transition:border-color .2s;flex:none}
.tg::after{content:'';position:absolute;top:5px;left:5px;width:16px;height:16px;border-radius:50%;background:#6E6E74;transition:transform .2s,background .2s}
.tg[aria-pressed="true"]{border-color:#FF4A1C}
.tg[aria-pressed="true"]::after{transform:translateX(20px);background:#FF4A1C}
.sq{width:44px;height:44px;border-radius:50%;border:1px solid #3A3A3F;background:transparent;color:#F4F4F1;font-size:20px;line-height:1;transition:background .15s,border-color .15s;flex:none}
.sq:hover{background:#17171A;border-color:#55555B}
.row{display:grid;align-items:center;gap:24px;padding:20px 0;border-top:1px solid #232326}
.box{border:1px solid #232326;border-radius:22px;padding:28px}
.link{color:#8A8A90;border-bottom:1px solid #3A3A3F;transition:color .15s}
.link:hover{color:#F4F4F1}
.dd{display:flex;gap:6px}
.dd button{width:34px;height:34px;border-radius:50%;border:1px solid #3A3A3F;background:transparent;color:#6E6E74;font-family:'Geist Mono',monospace;font-size:11px;transition:all .15s}
.dd button[aria-pressed="true"]{background:#F4F4F1;border-color:#F4F4F1;color:#0A0A0B}
.kp>div:first-child{border-left:0!important;padding-left:0!important}
a:focus-visible,button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid #FF4A1C;outline-offset:3px}
@keyframes blink{50%{opacity:.15}}
@keyframes breathe{0%,100%{transform:scale(.62);opacity:.7}50%{transform:scale(1);opacity:1}}
@keyframes pop{from{opacity:0;transform:translateY(8px)}}
.pop{animation:pop .4s ease both}

</style>
</helmet>
<div style="min-height:900px;background:#0A0A0B;color:#F4F4F1;font-family:'Geist',system-ui,sans-serif;font-size:15px;line-height:1.5">
<header style="display:flex;align-items:center;padding:0 40px;height:68px;border-bottom:1px solid #232326"><a href="PuntoPanel.dc.html" style="flex:1;font-weight:600;font-size:20px;letter-spacing:-.02em;display:flex;align-items:center;gap:3px">oficio<i style="width:7px;height:7px;border-radius:50%;background:#FF4A1C;margin-top:9px"></i></a><nav aria-label="Principal" style="display:flex;gap:32px;padding-left:14px"><a class="tab" href="PuntoPanel.dc.html" >Hoy</a><a class="tab" href="PuntoTimer.dc.html" aria-current="page">Práctica</a><a class="tab" href="PuntoStats.dc.html" >Datos</a><a class="tab" href="PuntoRetos.dc.html" >Retos</a><a class="tab" href="PuntoLogros.dc.html" >Logros</a><a class="tab" href="PuntoTienda.dc.html" >Tienda</a></nav><div style="flex:1;display:flex;justify-content:flex-end;align-items:center;gap:16px"><span class="lab">Mié 14.10.2026</span><a href="PuntoAvisos.dc.html" aria-label="Avisos" style="color:#8A8A90;position:relative;display:flex"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 16V11a6 6 0 0112 0v5l2 2H4zM10 21h4"/></svg><i style="position:absolute;right:-1px;top:-1px;width:6px;height:6px;border-radius:50%;background:#FF4A1C"></i></a><a href="PuntoAjustes.dc.html" aria-label="Ajustes" style="width:34px;height:34px;border-radius:50%;border:1px solid #3A3A3F;display:flex;align-items:center;justify-content:center;font-family:'Geist Mono',monospace;font-size:12px">K</a></div></header>
<main style="padding:0 40px 40px;display:flex;flex-direction:column;min-height:832px">
<div style="display:flex;align-items:center;padding:26px 0"><div role="tablist" aria-label="Modo" style="display:flex;gap:28px;flex:1"><sc-for list="{{tabs}}" as="t" hint-placeholder-count="3"><button type="button" role="tab" class="opt" aria-pressed="{{t.on}}" onClick="{{t.pick}}">{{t.l}}</button></sc-for></div><div style="display:flex;gap:28px;align-items:center"><a href="PuntoFoco.dc.html" class="lab link" style="border:0">Pantalla completa</a><a href="PuntoCierre.dc.html" class="lab link" style="border:0">Terminar sesión</a><span class="lab">Sesión <span style="color:#F4F4F1">{{session}}</span> / 04</span></div></div>
<div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:34px">
<div role="timer" aria-label="Tiempo restante {{time}}" style="{{gridStyle}};width:880px"><sc-for list="{{dots}}" as="d" hint-placeholder-count="175"><i class="dot" style="background:{{d.bg}};animation:{{d.an}}"></i></sc-for></div>
<div style="width:880px"><div role="progressbar" aria-label="Minutos" aria-valuemin="0" aria-valuemax="100" aria-valuenow="{{pct}}" style="display:flex;gap:4px;align-items:flex-end;height:28px"><sc-for list="{{ticks}}" as="t" hint-placeholder-count="25"><i style="flex:1;height:{{t.h}}px;background:{{t.bg}};border-radius:1px;transition:background .3s"></i></sc-for></div><div class="lab" style="display:flex;justify-content:space-between;margin-top:8px;font-size:10px"><span>{{elapsed}}</span><span>{{totalText}}</span></div></div>
<div style="display:flex;gap:12px"><button type="button" class="btn" onClick="{{reset}}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12a8 8 0 108-8H7M7 4L4 7l3 3"/></svg>Reiniciar</button><button type="button" class="btn sig" style="min-width:200px" onClick="{{toggle}}"><span style="display:{{dPlay}}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 4l13 8-13 8z"/></svg></span><span style="display:{{dPause}}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 4v16M16 4v16"/></svg></span>{{toggleText}}</button><button type="button" class="btn" onClick="{{skip}}">Saltar<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 4l10 8-10 8zM19 5v14"/></svg></button></div></div>
<div style="display:grid;grid-template-columns:1fr 1fr 1fr;border-top:1px solid #232326;margin-top:28px">
<div style="padding:22px 28px 0 0"><div class="lab" style="margin-bottom:14px">Habilidad</div><div style="display:flex;flex-direction:column;gap:10px;align-items:flex-start"><sc-for list="{{skills}}" as="k" hint-placeholder-count="3"><button type="button" class="opt" style="font-size:14px" aria-pressed="{{k.on}}" onClick="{{k.pick}}">{{k.n}}</button></sc-for></div></div>
<div style="padding:22px 28px 0;border-left:1px solid #232326"><div class="lab" style="margin-bottom:14px">Intención</div><input aria-label="Intención" placeholder="¿Qué vas a practicar?" value="{{intent}}" onChange="{{typing}}" style="width:100%;background:transparent;border:0;border-bottom:1px solid #3A3A3F;color:#F4F4F1;font-size:16px;padding:6px 0 10px;outline-offset:6px"></div>
<div style="padding:22px 0 0 28px;border-left:1px solid #232326"><div class="lab" style="margin-bottom:14px">Ambiente</div><div style="display:flex;gap:18px;flex-wrap:wrap"><sc-for list="{{amb}}" as="a" hint-placeholder-count="4"><button type="button" class="opt" style="font-size:14px" aria-pressed="{{a.on}}" onClick="{{a.pick}}">{{a.l}}</button></sc-for></div></div></div>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"focusMin":{"editor":"int","default":25,"min":1,"max":90,"unit":"min"},"shortMin":{"editor":"int","default":5,"min":1,"max":30,"unit":"min"},"longMin":{"editor":"int","default":15,"min":1,"max":60,"unit":"min"},"$preview":{"width":1360,"height":900}}'>
class Component extends DCLogic {
  total(m) { return (m === 'focus' ? (this.props.focusMin ?? 25) : m === 'short' ? (this.props.shortMin ?? 5) : (this.props.longMin ?? 15)) * 60; }
  componentDidMount() { this.t = setInterval(() => this.tick(), 1000); }
  componentWillUnmount() { clearInterval(this.t); }
  adv(completed) {
    const s = this.state || {};
    const mode = s.mode || 'focus';
    let done = s.done ?? 1;
    let next = 'focus';
    if (mode === 'focus') { if (completed) done += 1; next = done > 0 && done % 4 === 0 ? 'long' : 'short'; }
    this.setState({ mode: next, left: this.total(next), running: false, done });
  }
  tick() {
    const s = this.state || {};
    if (!s.running) return;
    const left = (s.left ?? this.total(s.mode || 'focus')) - 1;
    if (left > 0) this.setState({ left }); else this.adv(true);
  }
  base() {
    const s = this.state || {};
    const mode = s.mode || 'focus';
    const total = this.total(mode);
    const left = s.left ?? (mode === 'focus' ? total - 427 : total);
    const running = s.running ?? (mode === 'focus' && s.left === undefined ? false : !!s.running);
    const done = s.done ?? 1;
    const skill = s.skill ?? 0;
    const mm = String(Math.floor(left / 60)).padStart(2, '0'), ss = String(left % 60).padStart(2, '0');
    return { s, mode, total, left, running, done, skill, mm, ss, time: mm + ':' + ss, pct: Math.round((1 - left / total) * 100),
      setMode: (m) => this.setState({ mode: m, left: this.total(m), running: false }),
      toggle: () => this.setState({ running: !running, left }),
      reset: () => this.setState({ left: total, running: false }),
      skip: () => this.adv(false), pickSkill: (i) => this.setState({ skill: i }) };
  }
  dm(str, on, off, sig, running) {
    const G = { '0': ['01110', '10001', '10011', '10101', '11001', '10001', '01110'], '1': ['00100', '01100', '00100', '00100', '00100', '00100', '01110'], '2': ['01110', '10001', '00001', '00010', '00100', '01000', '11111'], '3': ['11110', '00001', '00001', '01110', '00001', '00001', '11110'], '4': ['00010', '00110', '01010', '10010', '11111', '00010', '00010'], '5': ['11111', '10000', '11110', '00001', '00001', '10001', '01110'], '6': ['00110', '01000', '10000', '11110', '10001', '10001', '01110'], '7': ['11111', '00001', '00010', '00100', '01000', '01000', '01000'], '8': ['01110', '10001', '10001', '01110', '10001', '10001', '01110'], '9': ['01110', '10001', '10001', '01111', '00001', '00010', '01100'], ':': ['0', '0', '1', '0', '1', '0', '0'] };
    const cols = [];
    str.split('').forEach((ch, i) => { const g = G[ch]; for (let c = 0; c < g[0].length; c++) cols.push({ colon: ch === ':', rows: g.map(r => r[c] === '1') }); if (i < str.length - 1) cols.push({ colon: false, rows: Array(7).fill(false) }); });
    const dots = [];
    for (let r = 0; r < 7; r++) for (let c = 0; c < cols.length; c++) { const lit = cols[c].rows[r]; const colon = cols[c].colon; dots.push({ bg: lit ? (colon ? sig : on) : off, an: colon && lit && running ? 'blink 1s steps(1) infinite' : 'none' }); }
    return { dots, n: cols.length };
  }
  renderVals() {
    const b = this.base(); const s = b.s; const focus = b.mode === 'focus';
    const names = ['Programación', 'Inglés', 'Guitarra']; const amb = ['Lluvia', 'Café', 'Lo-fi', 'Off']; const ai = s.amb ?? 2;
    const m = this.dm(b.time, '#F4F4F1', '#19191C', '#FF4A1C', b.running);
    const mins = Math.round(b.total / 60); const el = b.total - b.left;
    const f = (x) => String(Math.floor(x / 60)).padStart(2, '0') + ':' + String(x % 60).padStart(2, '0');
    return {
      dots: m.dots, gridStyle: 'display:grid;grid-template-columns:repeat(' + m.n + ',1fr);gap:9px', time: b.time, pct: b.pct,
      ticks: Array.from({ length: mins }, (_, i) => ({ h: (i + 1) % 5 === 0 ? 28 : 18, bg: el >= (i + 1) * 60 ? '#F4F4F1' : (el > i * 60 ? '#FF4A1C' : '#232326') })),
      tabs: [['focus', 'Foco'], ['short', 'Descanso corto'], ['long', 'Descanso largo']].map(([id, l]) => ({ l, on: b.mode === id, pick: () => b.setMode(id) })),
      session: String((b.done % 4) + 1).padStart(2, '0'), toggle: b.toggle, toggleText: b.running ? 'Pausar' : (b.left === b.total ? 'Empezar' : 'Seguir'), dPlay: b.running ? 'none' : 'inline-flex', dPause: b.running ? 'inline-flex' : 'none', reset: b.reset, skip: b.skip,
      elapsed: f(el), totalText: f(b.total), skills: names.map((n, i) => ({ n, on: b.skill === i, pick: () => b.pickSkill(i) })),
      amb: amb.map((l, i) => ({ l, on: ai === i, pick: () => this.setState({ amb: i }) })), intent: s.intent ?? '', typing: (e) => this.setState({ intent: e.target.value })
    };
  }
}
</script>
</body>
</html>
