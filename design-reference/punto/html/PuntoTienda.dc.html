<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Punto — Tienda de recompensas</title>
<script src="./dc-runtime.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&amp;family=Geist+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font-family:inherit;color:inherit}
button{cursor:pointer}
*{box-sizing:border-box}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.mono{font-family:'Geist Mono',ui-monospace,monospace;letter-spacing:.04em}
.lab{font-family:'Geist Mono',ui-monospace,monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#8A8A90}
.dot{aspect-ratio:1/1;border-radius:50%;transition:background .2s}
.tab{font-family:'Geist Mono',monospace;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:#8A8A90;padding:24px 0;position:relative;transition:color .15s}
.tab:hover{color:#F4F4F1}
.tab[aria-current="page"]{color:#F4F4F1}
.tab[aria-current="page"]::before{content:'';position:absolute;left:-14px;top:50%;width:6px;height:6px;margin-top:-3px;border-radius:50%;background:#FF4A1C}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:12px;height:52px;padding:0 26px;border-radius:999px;border:1px solid #3A3A3F;background:transparent;color:#F4F4F1;font-family:'Geist Mono',monospace;font-size:12px;letter-spacing:.12em;text-transform:uppercase;transition:background .15s,border-color .15s,transform .15s;white-space:nowrap}
.btn:hover{background:#17171A;border-color:#55555B}
.btn.sig{background:#FF4A1C;border-color:#FF4A1C;color:#0A0A0B;font-weight:500}
.btn.sig:hover{background:#FF6038;transform:translateY(-1px)}
.btn.sm{height:40px;padding:0 18px;font-size:11px}
.btn.danger{border-color:#7A2A18;color:#FF6A47}
.btn.danger:hover{background:#1A0E0B;border-color:#FF4A1C}
.opt{font-family:'Geist Mono',monospace;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:#6E6E74;background:none;border:0;padding:0;transition:color .15s;display:inline-flex;gap:8px;align-items:center}
.opt:hover{color:#F4F4F1}
.opt[aria-pressed="true"]{color:#F4F4F1}
.opt[aria-pressed="true"]::before{content:'';width:6px;height:6px;border-radius:50%;background:#FF4A1C}
.chip{font-family:'Geist Mono',monospace;font-size:12px;letter-spacing:.1em;text-transform:uppercase;border:1px solid #3A3A3F;border-radius:999px;padding:9px 18px;background:transparent;color:#8A8A90;transition:all .15s}
.chip:hover{border-color:#6E6E74;color:#F4F4F1}
.chip[aria-pressed="true"]{background:#F4F4F1;border-color:#F4F4F1;color:#0A0A0B}
.inp{width:100%;background:transparent;border:0;border-bottom:1px solid #3A3A3F;color:#F4F4F1;font-size:18px;padding:8px 0 12px;font-family:inherit;transition:border-color .15s;border-radius:0}
.inp::placeholder{color:#55555B}
.inp:focus{outline:none;border-bottom-color:#FF4A1C}
textarea.inp{border:1px solid #2E2E33;border-radius:14px;padding:14px 16px;min-height:130px;resize:vertical;line-height:1.55;font-size:16px}
textarea.inp:focus{border-color:#FF4A1C}
.tg{width:48px;height:28px;border-radius:999px;border:1px solid #3A3A3F;background:transparent;position:relative;transition:border-color .2s;flex:none}
.tg::after{content:'';position:absolute;top:5px;left:5px;width:16px;height:16px;border-radius:50%;background:#6E6E74;transition:transform .2s,background .2s}
.tg[aria-pressed="true"]{border-color:#FF4A1C}
.tg[aria-pressed="true"]::after{transform:translateX(20px);background:#FF4A1C}
.sq{width:44px;height:44px;border-radius:50%;border:1px solid #3A3A3F;background:transparent;color:#F4F4F1;font-size:20px;line-height:1;transition:background .15s,border-color .15s;flex:none}
.sq:hover{background:#17171A;border-color:#55555B}
.row{display:grid;align-items:center;gap:24px;padding:20px 0;border-top:1px solid #232326}
.box{border:1px solid #232326;border-radius:22px;padding:28px}
.link{color:#8A8A90;border-bottom:1px solid #3A3A3F;transition:color .15s}
.link:hover{color:#F4F4F1}
.dd{display:flex;gap:6px}
.dd button{width:34px;height:34px;border-radius:50%;border:1px solid #3A3A3F;background:transparent;color:#6E6E74;font-family:'Geist Mono',monospace;font-size:11px;transition:all .15s}
.dd button[aria-pressed="true"]{background:#F4F4F1;border-color:#F4F4F1;color:#0A0A0B}
.kp>div:first-child{border-left:0!important;padding-left:0!important}
a:focus-visible,button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid #FF4A1C;outline-offset:3px}
@keyframes blink{50%{opacity:.15}}
@keyframes breathe{0%,100%{transform:scale(.62);opacity:.7}50%{transform:scale(1);opacity:1}}
@keyframes pop{from{opacity:0;transform:translateY(8px)}}
.pop{animation:pop .4s ease both}

</style>
</helmet>
<div style="min-height:900px;background:#0A0A0B;color:#F4F4F1;font-family:'Geist',system-ui,sans-serif;font-size:15px;line-height:1.5">
<header style="display:flex;align-items:center;padding:0 40px;height:68px;border-bottom:1px solid #232326"><a href="PuntoPanel.dc.html" style="flex:1;font-weight:600;font-size:20px;letter-spacing:-.02em;display:flex;align-items:center;gap:3px">oficio<i style="width:7px;height:7px;border-radius:50%;background:#FF4A1C;margin-top:9px"></i></a><nav aria-label="Principal" style="display:flex;gap:32px;padding-left:14px"><a class="tab" href="PuntoPanel.dc.html" >Hoy</a><a class="tab" href="PuntoTimer.dc.html" >Práctica</a><a class="tab" href="PuntoStats.dc.html" >Datos</a><a class="tab" href="PuntoRetos.dc.html" >Retos</a><a class="tab" href="PuntoLogros.dc.html" >Logros</a><a class="tab" href="PuntoTienda.dc.html" aria-current="page">Tienda</a></nav><div style="flex:1;display:flex;justify-content:flex-end;align-items:center;gap:16px"><span class="lab">Mié 14.10.2026</span><a href="PuntoAvisos.dc.html" aria-label="Avisos" style="color:#8A8A90;position:relative;display:flex"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 16V11a6 6 0 0112 0v5l2 2H4zM10 21h4"/></svg><i style="position:absolute;right:-1px;top:-1px;width:6px;height:6px;border-radius:50%;background:#FF4A1C"></i></a><a href="PuntoAjustes.dc.html" aria-label="Ajustes" style="width:34px;height:34px;border-radius:50%;border:1px solid #3A3A3F;display:flex;align-items:center;justify-content:center;font-family:'Geist Mono',monospace;font-size:12px">K</a></div></header><main style="padding:0 40px 64px"><div style="padding:44px 0 34px;display:flex;align-items:flex-end;gap:32px;flex-wrap:wrap"><div style="flex:1;min-width:320px"><div class="lab" style="margin-bottom:14px">Recompensas</div><h1 style="margin:0;font-size:76px;font-weight:300;letter-spacing:-.05em;line-height:.95">Canjea tu esfuerzo</h1></div><div style="display:flex;gap:12px;align-items:center"><div style="text-align:right"><div class="lab">Saldo</div><div class="mono" style="font-size:44px;letter-spacing:-.04em;line-height:1.1">{{balance}} <span style="font-size:16px;color:#8A8A90">XP</span></div></div></div></div>
<section style="display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-top:1px solid #232326"><sc-for list="{{items}}" as="r" hint-placeholder-count="8"><div style="padding:28px 26px 28px;border-bottom:1px solid #232326;border-right:1px solid #232326;display:flex;flex-direction:column;gap:14px;opacity:{{r.op}}"><div style="display:grid;grid-template-columns:repeat(7,9px);gap:4px"><sc-for list="{{r.dots}}" as="d" hint-placeholder-count="49"><i style="width:9px;height:9px;border-radius:50%;background:{{d.bg}}"></i></sc-for></div><div style="font-size:20px;font-weight:500;letter-spacing:-.01em;margin-top:8px">{{r.n}}</div><div class="mono" style="font-size:13px;color:#8A8A90">{{r.cost}} XP{{r.extra}}</div><button type="button" class="btn sm {{r.cls}}" style="margin-top:auto;align-self:flex-start" onClick="{{r.buy}}">{{r.btn}}</button></div></sc-for>
<a href="#" style="padding:28px 26px;border-bottom:1px solid #232326;display:flex;align-items:center;justify-content:center;gap:10px;color:#8A8A90;border-right:1px solid #232326" class="lab">+ Crear recompensa</a></section>
<section style="padding-top:34px"><div class="lab" style="margin-bottom:8px">Canjeado</div><sc-for list="{{history}}" as="h" hint-placeholder-count="3"><div class="row" style="grid-template-columns:120px 1fr auto;padding:14px 0"><span class="mono" style="color:#8A8A90;font-size:13px">{{h.d}}</span><span style="font-size:17px">{{h.n}}</span><span class="mono" style="font-size:13px">−{{h.c}} XP</span></div></sc-for></section></main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1360,"height":900}}'>
class Component extends DCLogic {
  ic7(name, on, off) {
    const P = { flame: ['0001000', '0011000', '0011100', '0111110', '0111110', '0111110', '0011100'], clock: ['0011100', '0100010', '1001001', '1001101', '1000001', '0100010', '0011100'], flag: ['1111100', '1111110', '1111100', '1000000', '1000000', '1000000', '1000000'], star: ['0001000', '0001000', '1111111', '0111110', '0011100', '0110110', '0100010'], bolt: ['0001100', '0011000', '0110000', '1111110', '0001100', '0011000', '0010000'], moon: ['0011100', '0111000', '1110000', '1110000', '1110000', '0111001', '0011110'], sun: ['1001001', '0101010', '0011100', '1111111', '0011100', '0101010', '1001001'], book: ['1111011', '1000101', '1011101', '1000101', '1011101', '1000101', '1111011'], trophy: ['1111111', '1111111', '0111110', '0011100', '0001000', '0001000', '0111110'], gift: ['0011100', '0100010', '1111111', '1001001', '1111111', '1001001', '1111111'], coffee: ['0100100', '0010010', '1111100', '1111101', '1111101', '0111110', '1111111'], game: ['0000000', '0111110', '1101011', '1011101', '1101011', '0111110', '0000000'], cake: ['0001000', '0001000', '0111110', '1111111', '1011101', '1111111', '1111111'], film: ['0000100', '1111111', '1010101', '1111111', '1000001', '1000001', '1111111'], camera: ['0111000', '1111111', '1000001', '1011101', '1010101', '1011101', '1111111'], heart: ['0110110', '1111111', '1111111', '1111111', '0111110', '0011100', '0001000'] };
    return P[name].join('').split('').map(c => ({ bg: c === '1' ? on : off }));
  }
  renderVals() {
    const st = this.state || {}; const bal = st.bal ?? 1240; const owned = st.owned || [];
    const R = [['coffee', 'Café especial', 150], ['game', '1 hora de videojuegos', 300], ['film', 'Noche de película', 400], ['cake', 'Postre favorito', 250], ['gift', 'Compra de 20 USD', 1200], ['book', 'Libro nuevo', 800], ['heart', 'Día libre de práctica', 600], ['star', 'Cena fuera', 1500]];
    const fm = (n) => n >= 1000 ? Math.floor(n / 1000) + '.' + String(n % 1000).padStart(3, '0') : String(n);
    const hist = [...owned.map(i => ({ d: 'Ahora', n: R[i][1], c: R[i][2] })), { d: '10 oct', n: 'Café especial', c: 150 }, { d: '3 oct', n: 'Noche de película', c: 400 }];
    return {
      balance: fm(bal),
      items: R.map(([ic, n, c], i) => { const can = bal >= c; const got = owned.includes(i); return { n, cost: fm(c), extra: can || got ? '' : ' · faltan ' + fm(c - bal), op: can || got ? 1 : 0.5, cls: can && !got ? 'sig' : '', btn: got ? 'Canjeado' : (can ? 'Canjear' : 'Bloqueado'), dots: this.ic7(ic, can ? '#F4F4F1' : '#55555B', '#1B1B1E'), buy: () => { if (can && !got) this.setState({ bal: bal - c, owned: [...owned, i] }); } }; }),
      history: hist.slice(0, 5)
    };
  }
}
</script>
</body>
</html>
